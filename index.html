// =====================================================================
// モード: ドタバタキッチン (オーバークック風)
// =====================================================================
(() => {
  // # カウンター . 床 T/L/O 食材箱 C まな板 S コンロ P お皿 W 提出口 X ゴミ箱
  const STAGES = {
    basic: [
      '##T#L#O##C#C###',
      '#.............S',
      '#......#......S',
      'C......#......#',
      'P......#......W',
      '#......#......W',
      'X......#......#',
      '#.............#',
      '###S###C###P#X#',
    ],
    // 真ん中の壁で分断。カウンター越しに食材を渡し合う
    split: [
      '##T#L#O#S#S#S##',
      '#......#......#',
      'C......#......W',
      '#......#......#',
      'C......#......W',
      '#......#......#',
      'X......#......P',
      '#......#......#',
      '###C#P##X#C####',
    ],
    // 食材と提出口が遠い。走り回れ
    long: [
      '##T#L#O##C#C##S#S##',
      '#.................#',
      'P.................W',
      '#...#########.....#',
      'X.................W',
      '#.................#',
      '####C####P####S#X##',
    ],
    // せまくてぶつかりまくる
    tight: [
      '#T#L#O#S#S#',
      'C.........W',
      '#...#.#...#',
      'P.........W',
      '#...#.#...#',
      'X.........#',
      '###C###C###',
    ],
  };
  // 難易度: 制限時間・注文の制限時間/間隔・焦げるまでの時間・出る料理・★の基準の倍率
  const DIFFS = {
    easy: { time: 200, orderTime: 1.4, interval: 1.4, burn: 1.6, pool: ['salad', 'salad', 'tsalad', 'tsalad', 'tsoup', 'osoup'], th: .7 },
    normal: { time: 180, orderTime: 1, interval: 1, burn: 1, pool: ['salad', 'salad', 'tsalad', 'tsoup', 'osoup'], th: 1 },
    hard: { time: 180, orderTime: .8, interval: .75, burn: .7, pool: ['salad', 'tosalad', 'full', 'tsoup', 'osoup'], th: 1.3 },
    oni: { time: 150, orderTime: .65, interval: .55, burn: .5, pool: ['tosalad', 'full', 'full', 'tsoup', 'osoup', 'salad'], th: 1.6 },
  };
  // 床マスから均等にスポーン位置を選ぶ
  function spawnsOf(map) {
    const cells = [];
    map.forEach((row, y) => [...row].forEach((c, x) => { if (c === '.') cells.push([x + .5, y + .5]); }));
    return [0, .5, .25, .75, .12, .62, .37, .87].map(f => cells[Math.floor(f * (cells.length - 1))]);
  }
  const CRATE = { T: 'tomato', L: 'lettuce', O: 'onion' };
  const ING = new Set(['tomato', 'lettuce', 'onion']);
  const SOUPABLE = new Set(['tomato', 'onion']);
  const EMO = { tomato: '🍅', lettuce: '🥬', onion: '🧅' };
  const RECIPES = [
    { id: 'salad', name: 'ミックスサラダ', need: ['lettuce', 'tomato'], pts: 20, time: 55 },
    { id: 'tsalad', name: 'トマトサラダ', need: ['tomato'], pts: 10, time: 40 },
    { id: 'tsoup', name: 'トマトスープ', need: ['tomato_soup'], pts: 30, time: 75 },
    { id: 'osoup', name: 'オニオンスープ', need: ['onion_soup'], pts: 30, time: 75 },
    { id: 'tosalad', name: 'トマトオニオン', need: ['onion', 'tomato'], pts: 25, time: 60 },
    { id: 'full', name: '具だくさんサラダ', need: ['lettuce', 'onion', 'tomato'], pts: 35, time: 70 },
  ];
  const CHOP_TIME = 1.4, COOK_TIME = 6, BURN_TIME = 11, MAX_ORDERS = 5;
  const R = 0.34, SPEED = 4.2, DASH = 10;
  const recipeKey = arr => [...arr].sort().join('+');

  const tileAt = gridAt;
  const collide = (map, p) => gridCollide(map, p, R);
  const target = p => {
    let dx = 0, dy = 0;
    if (Math.abs(p.fx) >= Math.abs(p.fy)) dx = p.fx >= 0 ? 1 : -1; else dy = p.fy >= 0 ? 1 : -1;
    return [Math.floor(p.x) + dx, Math.floor(p.y) + dy];
  };

  // ---------- ホスト側ロジック ----------
  function ev(S, k, x, y, txt) {
    S.ev.push({ id: S.evId++, k, x, y, txt });
    if (S.ev.length > 24) S.ev.shift();
  }
  function newOrder(S, forced) {
    const pool = S.cfg.pool, id = forced || pool[Math.random() * pool.length | 0];
    const r = RECIPES.findIndex(x => x.id === id), T = Math.round(RECIPES[r].time * S.cfg.orderTime);
    S.orders.push({ id: S.oid++, r, t: T, T });
    ev(S, 'order', -1, -1);
  }
  function addToPlate(plate, it) {
    if (!ING.has(it.k) || !it.ch) return false;
    if (plate.c.length >= 3 || plate.c.includes(it.k) || plate.c.some(x => x.endsWith('_soup'))) return false;
    plate.c.push(it.k); return true;
  }
  const resetPot = pot => { pot.c = []; pot.cook = 0; pot.st = 'empty'; };

  function serve(S, p, tx, ty) {
    const key = recipeKey(p.held.c);
    const idx = S.orders.findIndex(o => recipeKey(RECIPES[o.r].need) === key);
    if (idx < 0) return ev(S, 'nope', tx, ty, '注文にない!');
    const o = S.orders[idx], pts = RECIPES[o.r].pts + Math.round(8 * o.t / o.T);
    S.score += pts; S.served++; S.orders.splice(idx, 1); p.held = null;
    ev(S, 'serve', tx, ty, `+${pts}`);
  }

  function interact(S, p) {
    const [tx, ty] = target(p), c = tileAt(S.map, tx, ty), k = tx + ',' + ty, H = p.held;
    if (c === '.') return;
    if (CRATE[c]) {
      if (!H) { p.held = { k: CRATE[c], ch: 0 }; ev(S, 'pick', tx, ty); }
      else if (H.k === CRATE[c] && !H.ch) { p.held = null; ev(S, 'drop', tx, ty); }
      return;
    }
    if (c === 'P') {
      if (!H) { p.held = { k: 'plate', c: [] }; ev(S, 'pick', tx, ty); }
      else if (H.k === 'plate' && !H.c.length) { p.held = null; ev(S, 'drop', tx, ty); }
      else if (ING.has(H.k)) {
        // 食材を持ってお皿置き場 → お皿に盛って持つ
        const plate = { k: 'plate', c: [] };
        if (addToPlate(plate, H)) { p.held = plate; ev(S, 'drop', tx, ty); }
        else ev(S, 'nope', tx, ty, '切ってから!');
      }
      return;
    }
    if (c === 'X') {
      if (!H) return;
      if (H.k === 'plate') { if (H.c.length) { H.c = []; ev(S, 'trash', tx, ty); } }
      else { p.held = null; ev(S, 'trash', tx, ty); }
      return;
    }
    if (c === 'W') {
      if (H && H.k === 'plate' && H.c.length) serve(S, p, tx, ty);
      else if (H) ev(S, 'nope', tx, ty, 'お皿にのせてね!');
      return;
    }
    if (c === 'S') {
      const pot = S.pots[k];
      if (H && ING.has(H.k)) {
        if (!H.ch) return ev(S, 'nope', tx, ty, '切ってから!');
        if (!SOUPABLE.has(H.k)) return ev(S, 'nope', tx, ty, 'レタスは煮れない!');
        if (pot.st === 'done' || pot.st === 'burnt' || pot.st === 'cooking') return ev(S, 'nope', tx, ty, 'いっぱい!');
        if (pot.c.length && pot.c[0] !== H.k) return ev(S, 'nope', tx, ty, 'まぜられない!');
        pot.c.push(H.k); p.held = null;
        if (pot.c.length >= 3) { pot.st = 'cooking'; pot.cook = 0; } else pot.st = 'filling';
        return ev(S, 'drop', tx, ty);
      }
      if (H && H.k === 'plate') {
        if (pot.st === 'burnt') return ev(S, 'nope', tx, ty, '手ぶらで焦げを捨てて!');
        if (pot.st !== 'done') return;
        if (H.c.length) return ev(S, 'nope', tx, ty, '空のお皿で!');
        H.c = [pot.c[0] + '_soup']; resetPot(pot);
        return ev(S, 'pick', tx, ty);
      }
      if (!H && pot.st === 'burnt') { resetPot(pot); ev(S, 'trash', tx, ty, '焦げポイッ'); }
      else if (!H && pot.st === 'filling') {
        // 煮始める前なら食材を取り出せる
        p.held = { k: pot.c.pop(), ch: 1 };
        if (!pot.c.length) pot.st = 'empty';
        ev(S, 'pick', tx, ty);
      }
      return;
    }
    // カウンター / まな板: 1マスにアイテム1つ
    const I = S.items[k];
    if (!H && I) { p.held = I; delete S.items[k]; ev(S, 'pick', tx, ty); }
    else if (H && !I) { S.items[k] = H; p.held = null; ev(S, 'drop', tx, ty); }
    else if (H && I) {
      if (H.k === 'plate' && addToPlate(H, I)) { delete S.items[k]; ev(S, 'drop', tx, ty); }
      else if (I.k === 'plate' && addToPlate(I, H)) { p.held = null; ev(S, 'drop', tx, ty); }
      else if ((H.k === 'plate' && ING.has(I.k) && !I.ch) || (I.k === 'plate' && ING.has(H.k) && !H.ch)) ev(S, 'nope', tx, ty, '切ってから!');
      else ev(S, 'nope', tx, ty, 'のせられない!');
    }
  }

  MODES.cooking = {
    create(players, opts = {}) {
      const map = STAGES[opts.stage] || STAGES.basic, cfg = DIFFS[opts.diff] || DIFFS.normal;
      const S = { map, cfg, spawns: spawnsOf(map), phase: 'count', count: 3.5, time: cfg.time, score: 0, served: 0, failed: 0,
        items: {}, pots: {}, orders: [], orderTimer: 6, oid: 1, ev: [], evId: 1, players: [], nStart: players.length };
      map.forEach((row, y) => [...row].forEach((c, x) => { if (c === 'S') S.pots[x + ',' + y] = { c: [], cook: 0, st: 'empty' }; }));
      players.forEach(p => this.addPlayer(S, p));
      newOrder(S, cfg.pool.includes('tsalad') ? 'tsalad' : 'salad');
      return S;
    },
    addPlayer(S, p) {
      const sp = S.spawns[S.players.length % S.spawns.length];
      S.players.push({ id: p.id, name: p.name, color: p.color, x: sp[0], y: sp[1], fx: 0, fy: 1, held: null, lg: undefined, chop: false });
    },
    removePlayer(S, id) { S.players = S.players.filter(p => p.id !== id); },
    initData(S) { return { map: S.map, burnK: S.cfg.burn }; },

    step(S, dt, inputs) {
      if (S.phase === 'count') { S.count -= dt; if (S.count <= 0) S.phase = 'play'; }
      const play = S.phase === 'play';
      for (const p of S.players) {
        const inp = inputs[p.id]; p.chop = false;
        if (!inp) continue;
        p.x = inp.x; p.y = inp.y; p.fx = inp.fx; p.fy = inp.fy;
        if (p.lg === undefined) p.lg = inp.g;
        if (inp.g !== p.lg) { p.lg = inp.g; if (play) interact(S, p); }
        if (play && inp.ah && !p.held) {
          const [tx, ty] = target(p), it = S.items[tx + ',' + ty];
          if (tileAt(S.map, tx, ty) === 'C' && it && ING.has(it.k) && !it.ch) {
            p.chop = true; it.pr = (it.pr || 0) + dt / CHOP_TIME;
            if (it.pr >= 1) { it.ch = 1; delete it.pr; ev(S, 'chopdone', tx, ty); }
          }
        }
      }
      if (!play) return;
      S.time -= dt;
      for (const k in S.pots) {
        const pot = S.pots[k], [x, y] = k.split(',').map(Number);
        if (pot.st === 'cooking') { pot.cook += dt; if (pot.cook >= COOK_TIME) { pot.st = 'done'; ev(S, 'done', x, y, 'できた!'); } }
        else if (pot.st === 'done') { pot.cook += dt; if (pot.cook >= COOK_TIME + BURN_TIME * S.cfg.burn) { pot.st = 'burnt'; ev(S, 'burn', x, y, '焦げた!!'); } }
      }
      for (const o of S.orders) o.t -= dt;
      const expired = S.orders.filter(o => o.t <= 0);
      if (expired.length) {
        S.orders = S.orders.filter(o => o.t > 0);
        for (const _ of expired) { S.failed++; S.score = Math.max(0, S.score - 10); ev(S, 'expire', 7, 0, '注文キャンセル… -10'); }
      }
      S.orderTimer -= dt;
      if (!S.orders.length) S.orderTimer = Math.min(S.orderTimer, 1.5);
      if (S.orderTimer <= 0 && S.orders.length < MAX_ORDERS) {
        newOrder(S);
        S.orderTimer = (Math.max(8, 19 - 2.5 * S.players.length) + Math.random() * 4 - 2) * S.cfg.interval;
      }
    },
    snapshot(S) {
      return {
        ph: S.phase, cnt: S.count, tm: S.time, sc: S.score,
        pl: S.players.map(p => ({ id: p.id, n: p.name, c: p.color, x: r2(p.x), y: r2(p.y), fx: r2(p.fx), fy: r2(p.fy), h: p.held, ch: p.chop ? 1 : 0 })),
        it: S.items, po: S.pots, or: S.orders.map(o => ({ id: o.id, r: o.r, t: r2(o.t), T: o.T })), ev: S.ev,
      };
    },
    isOver(S) { return S.phase === 'play' && S.time <= 0; },
    result(S) {
      const n = clamp(S.nStart, 1, 4), mul = 1 + 0.35 * (n - 1);
      const th = [40, 100, 170].map(v => Math.round(v * mul * S.cfg.th));
      return { stars: th.filter(v => S.score >= v).length,
        stats: [['スコア', S.score], ['提供', S.served], ['キャンセル', S.failed]] };
    },

    // ---------- 全員共通: 自キャラの移動はローカルで計算しホストへ送る ----------
    clientFrame(app, inp, dt) {
      const s = app.snap, map = app.init.map;
      const mine = s.pl.find(p => p.id === app.myId);
      if (!mine) { app.me = null; return; }
      if (!app.me) app.me = { x: mine.x, y: mine.y, fx: mine.fx, fy: mine.fy, dv: 0, la: inp.a, chopT: 0 };
      const me = app.me;
      const ml = Math.hypot(inp.mx, inp.my);
      if (ml > 0.2) { me.fx = inp.mx / ml; me.fy = inp.my / ml; }
      if (inp.a !== me.la) {
        me.la = inp.a;
        const [tx, ty] = target(me), it = s.it[tx + ',' + ty];
        const canChop = !mine.h && tileAt(map, tx, ty) === 'C' && it && ING.has(it.k) && !it.ch;
        if (!canChop) { me.dv = DASH; sfx('dash'); }
      }
      const vx = inp.mx * SPEED + me.fx * me.dv, vy = inp.my * SPEED + me.fy * me.dv;
      me.dv *= Math.exp(-9 * dt); if (me.dv < 0.3) me.dv = 0;
      const steps = Math.max(1, Math.ceil(Math.hypot(vx, vy) * dt / 0.15));
      for (let i = 0; i < steps; i++) { me.x += vx * dt / steps; me.y += vy * dt / steps; collide(map, me); }

      const f = 1 - Math.exp(-14 * dt);
      for (const o of s.pl) {
        if (o.id === app.myId) continue;
        const rp = app.rp[o.id] || (app.rp[o.id] = { x: o.x, y: o.y });
        rp.x += (o.x - rp.x) * f; rp.y += (o.y - rp.y) * f;
        const dx = me.x - rp.x, dy = me.y - rp.y, d = Math.hypot(dx, dy);
        if (d < R * 2 && d > 1e-4) { me.x += dx / d * (R * 2 - d); me.y += dy / d * (R * 2 - d); collide(map, me); }
      }

      if (app.lastEv < 0) app.lastEv = s.ev.length ? s.ev[s.ev.length - 1].id : 0;
      for (const e of s.ev) if (e.id > app.lastEv) {
        app.lastEv = e.id; sfx(e.k);
        if (e.txt) app.floaters.push({ x: e.x + .5, y: e.y + .3, txt: e.txt, k: e.k, t: 1.5 });
      }
      me.chopT -= dt;
      if (s.pl.some(p => p.ch) && me.chopT <= 0) { sfx('chop'); me.chopT = 0.15; }
      if (!isTouch) setHint(hintFor(s, mine.h, target(me), map));
    },
    inputMsg(app, inp) {
      const me = app.me; if (!me) return null;
      return { x: r2(me.x), y: r2(me.y), fx: r2(me.fx), fy: r2(me.fy), g: inp.g, a: inp.a, ah: inp.ah };
    },

    // ---------- 描画 ----------
    render(app, dt, W, H) {
      const s = app.snap;
      if (!s) { label('接続中…', W / 2, H / 2, 30 * dpr, '#fff'); return; }
      const map = app.init.map, cols = map[0].length, rows = map.length;
      const hud = Math.min(96 * dpr, H * 0.2);
      const ts = Math.floor(Math.min(W / cols, (H - hud) / rows));
      const ox = (W - cols * ts) / 2, oy = hud + (H - hud - rows * ts) / 2;
      const X = x => ox + x * ts, Y = y => oy + y * ts;
      const now = performance.now() / 1000;

      // タイル
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const c = map[y][x], px = X(x), py = Y(y);
        if (c === '.') { ctx.fillStyle = (x + y) % 2 ? '#4a4f6e' : '#434763'; ctx.fillRect(px, py, ts, ts); continue; }
        ctx.fillStyle = '#8a6848'; ctx.fillRect(px, py, ts, ts);
        ctx.fillStyle = '#d6ae84'; ctx.fillRect(px + 1, py + 1, ts - 2, ts * 0.82);
        if (CRATE[c]) {
          ctx.fillStyle = '#a0703c'; rrect(px + ts * .1, py + ts * .1, ts * .8, ts * .66, ts * .08); ctx.fill();
          emo(EMO[CRATE[c]], px + ts / 2, py + ts * .43, ts * .5);
        } else if (c === 'C') {
          ctx.fillStyle = '#f1dcb4'; rrect(px + ts * .12, py + ts * .14, ts * .76, ts * .56, ts * .08); ctx.fill();
          emo('🔪', px + ts * .8, py + ts * .22, ts * .26);
        } else if (c === 'S') {
          ctx.fillStyle = '#3b3b44'; rrect(px + ts * .08, py + ts * .08, ts * .84, ts * .7, ts * .1); ctx.fill();
          ctx.strokeStyle = '#ff6b3d'; ctx.lineWidth = ts * .05; ctx.beginPath(); ctx.arc(px + ts / 2, py + ts * .43, ts * .28, 0, 7); ctx.stroke();
        } else if (c === 'P') {
          for (let i = 0; i < 3; i++) { ctx.fillStyle = i === 2 ? '#fff' : '#ddd'; ctx.beginPath(); ctx.ellipse(px + ts / 2, py + ts * (.55 - i * .08), ts * .32, ts * .14, 0, 0, 7); ctx.fill(); }
        } else if (c === 'W') {
          ctx.fillStyle = '#ffcf40'; ctx.fillRect(px + ts * .06, py + ts * .06, ts * .88, ts * .72);
          ctx.fillStyle = '#e0a800'; for (let i = 0; i < 4; i++) ctx.fillRect(px + ts * .06, py + ts * (.1 + i * .18), ts * .88, ts * .07);
          emo('🛎️', px + ts / 2, py + ts * .42, ts * .44);
        } else if (c === 'X') {
          emo('🗑️', px + ts / 2, py + ts * .42, ts * .55);
        }
      }

      // カウンター上のアイテム
      for (const k in s.it) {
        const [x, y] = k.split(',').map(Number), it = s.it[k];
        drawItem(it, X(x) + ts / 2, Y(y) + ts * .42, ts * .7);
        if (it.pr) bar(X(x) + ts * .12, Y(y) + ts * .74, ts * .76, ts * .12, it.pr, '#69f0ae');
      }
      // 鍋
      for (const k in s.po) {
        const [x, y] = k.split(',').map(Number), pot = s.po[k], cx = X(x) + ts / 2, cy = Y(y) + ts * .43;
        ctx.fillStyle = pot.st === 'burnt' ? '#111' : '#9aa0b0';
        ctx.beginPath(); ctx.arc(cx, cy, ts * .3, 0, 7); ctx.fill();
        ctx.fillStyle = pot.st === 'burnt' ? '#222' : pot.st === 'done' ? '#e57a3c' : '#5d6272';
        ctx.beginPath(); ctx.arc(cx, cy, ts * .23, 0, 7); ctx.fill();
        if (pot.st === 'burnt') emo('🔥', cx, cy - ts * .1, ts * .5);
        else pot.c.forEach((g, i) => emo(EMO[g], cx + (i - 1) * ts * .15, cy, ts * .2));
        if (pot.st === 'cooking') bar(X(x) + ts * .12, Y(y) + ts * .8, ts * .76, ts * .12, pot.cook / COOK_TIME, '#ffcf40');
        if (pot.st === 'done') {
          const bt = BURN_TIME * (app.init.burnK || 1), warn = pot.cook > COOK_TIME + bt * 0.45;
          bar(X(x) + ts * .12, Y(y) + ts * .8, ts * .76, ts * .12, 1 - (pot.cook - COOK_TIME) / bt, warn ? '#ff5252' : '#69f0ae');
          if (warn && Math.sin(now * 14) > 0) label('!', cx + ts * .32, Y(y) + ts * .1, ts * .45, '#ff5252', '#000');
          else if (!warn) emo('✅', cx + ts * .3, Y(y) + ts * .12, ts * .22);
        }
      }

      // 自分の向いているマス
      if (app.me) {
        const [tx, ty] = target(app.me);
        if (tileAt(map, tx, ty) !== '.') {
          ctx.strokeStyle = '#fffb'; ctx.lineWidth = Math.max(2, ts * .05);
          rrect(X(tx) + 2, Y(ty) + 2, ts - 4, ts - 4, ts * .12); ctx.stroke();
        }
      }

      // プレイヤー (y順)
      const pls = s.pl.map(p => {
        const pos = p.id === app.myId && app.me ? app.me : (app.rp[p.id] || p);
        return { p, x: pos.x, y: pos.y, fx: p.id === app.myId && app.me ? app.me.fx : p.fx, fy: p.id === app.myId && app.me ? app.me.fy : p.fy };
      }).sort((a, b) => a.y - b.y);
      for (const { p, x, y, fx, fy } of pls) {
        const cx = X(x), cy = Y(y), r = ts * R;
        ctx.fillStyle = '#0005'; ctx.beginPath(); ctx.ellipse(cx, cy + r * .8, r * .9, r * .35, 0, 0, 7); ctx.fill();
        const bob = p.ch ? Math.sin(now * 30) * r * .08 : 0;
        ctx.fillStyle = p.c; ctx.strokeStyle = '#0008'; ctx.lineWidth = Math.max(1.5, ts * .03);
        ctx.beginPath(); ctx.arc(cx, cy + bob, r, 0, 7); ctx.fill(); ctx.stroke();
        // 目
        ctx.fillStyle = '#222';
        for (const side of [-1, 1]) {
          const ex = cx + fx * r * .45 - fy * side * r * .3, ey = cy + bob + fy * r * .35 + fx * side * r * .3 - r * .1;
          ctx.beginPath(); ctx.arc(ex, ey, r * .11, 0, 7); ctx.fill();
        }
        // コック帽
        ctx.fillStyle = '#fff';
        ctx.fillRect(cx - r * .5, cy + bob - r * 1.15, r, r * .35);
        for (const dx of [-.35, 0, .35]) { ctx.beginPath(); ctx.arc(cx + dx * r, cy + bob - r * 1.25, r * .32, 0, 7); ctx.fill(); }
        if (p.h) drawItem(p.h, cx + fx * r * .9, cy + fy * r * .7 + bob, ts * .52);
        if (p.ch) emo('🔪', cx + fx * r * 1.3, cy + fy * r - r * .3, ts * .3);
        label(p.n, cx, cy - r * 1.95, Math.max(11, ts * .24), p.id === app.myId ? '#ffcf40' : '#fff', '#000c');
      }

      // ふきだし
      app.floaters = app.floaters.filter(f => (f.t -= dt) > 0);
      for (const f of app.floaters) {
        const col = f.k === 'serve' ? '#ffcf40' : (f.k === 'burn' || f.k === 'expire') ? '#ff5252' : f.k === 'done' ? '#69f0ae' : '#fff';
        label(f.txt, X(f.x), Y(f.y) - (1.5 - f.t) * ts * .6, ts * (f.k === 'serve' ? .5 : .34), col, '#000');
      }

      // HUD: 注文
      const cw = Math.min(130 * dpr, (W - 170 * dpr) / MAX_ORDERS - 8 * dpr), ch = hud - 16 * dpr;
      s.or.forEach((o, i) => {
        const R0 = RECIPES[o.r], x0 = 8 * dpr + i * (cw + 8 * dpr), y0 = 8 * dpr, v = o.t / o.T;
        const shake = v < .25 ? Math.sin(now * 25) * 2 * dpr : 0;
        ctx.fillStyle = '#fff'; rrect(x0 + shake, y0, cw, ch, 10 * dpr); ctx.fill();
        const icons = R0.need;
        icons.forEach((g, j) => {
          const ix = x0 + shake + cw * (j + 1) / (icons.length + 1), iy = y0 + ch * .36, sz = Math.min(cw / (icons.length + .6), ch * .42);
          if (g.endsWith('_soup')) { emo('🍲', ix, iy, sz); emo(EMO[g.replace('_soup', '')], ix + sz * .38, iy - sz * .3, sz * .45); }
          else emo(EMO[g], ix, iy, sz);
        });
        label(R0.name, x0 + shake + cw / 2, y0 + ch * .72, Math.min(12 * dpr, cw / 7.5), '#333');
        bar(x0 + shake + cw * .08, y0 + ch * .86, cw * .84, ch * .08, v, v > .5 ? '#4caf50' : v > .25 ? '#ffb300' : '#f44336');
      });
      // HUD: スコア・時間
      const tm = Math.max(0, Math.ceil(s.tm)), mm = Math.floor(tm / 60), ss = String(tm % 60).padStart(2, '0');
      label(`⏱ ${mm}:${ss}`, W - 75 * dpr, hud * .32, 26 * dpr, tm <= 30 && Math.sin(now * 8) > 0 ? '#ff5252' : '#fff', '#000');
      label(`💰 ${s.sc}`, W - 75 * dpr, hud * .72, 24 * dpr, '#ffcf40', '#000');

      if (H > W * 1.3) label('📱 横向きにすると大きく見えます', W / 2, oy + rows * ts + 30 * dpr, 14 * dpr, '#b8b3d9');

      if (s.ph === 'count') {
        const n = Math.ceil(s.cnt - .5);
        ctx.fillStyle = '#0006'; ctx.fillRect(0, 0, W, H);
        label(n > 0 ? String(n) : 'スタート!', W / 2, H / 2, Math.min(W, H) * (n > 0 ? .3 : .15), '#ffcf40', '#000');
      }
    },
  };

  // PC 用: いま持っている物と向いているマスから、次にやることを表示する
  function hintFor(s, H, [tx, ty], map) {
    const c = tileAt(map, tx, ty), it = s.it[tx + ',' + ty], pot = s.po[tx + ',' + ty];
    if (!H) {
      if (CRATE[c]) return `つかむ → ${EMO[CRATE[c]]} をとる`;
      if (c === 'C' && it && ING.has(it.k) && !it.ch) return 'Shift 長押し → 🔪 きる';
      if (c === 'P') return 'つかむ → 🍽️ お皿をとる';
      if (pot && pot.st === 'burnt') return 'つかむ → 焦げを捨てる';
      if (pot && pot.st === 'filling') return 'つかむ → 鍋から食材を取り出す';
      if (pot && pot.st === 'done') return 'からのお皿を持ってきて、スープをすくおう';
      if (it) return 'つかむ → 持ち上げる';
      return '食材箱から食材をとろう';
    }
    if (H.k === 'plate') {
      if (!H.c.length) return '切った食材をのせる / できたスープをすくう';
      if (c === 'W') return 'つかむ → 🛎️ 提出!';
      return 'お皿を 🛎️ 提出口へ! (のせ足しもOK)';
    }
    if (!H.ch) return c === 'C' && !it ? 'つかむ → まな板に置く(置いたら Shift 長押しで切る)' : 'まな板 🔪 に置いて切ろう';
    if (H.k === 'lettuce') return 'お皿 🍽️ に盛ろう (お皿置き場でもOK)';
    return 'お皿 🍽️ に盛る / 鍋に入れる (同じ野菜3つでスープ)';
  }

  function drawItem(it, x, y, sz) {
    if (it.k === 'plate') {
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#bbb'; ctx.lineWidth = sz * .04;
      ctx.beginPath(); ctx.ellipse(x, y + sz * .08, sz * .48, sz * .3, 0, 0, 7); ctx.fill(); ctx.stroke();
      const soup = it.c.find(c => c.endsWith('_soup'));
      if (soup) { emo('🍲', x, y, sz * .6); emo(EMO[soup.replace('_soup', '')], x + sz * .3, y - sz * .2, sz * .28); }
      else it.c.forEach((g, i) => emo(EMO[g], x + (i - (it.c.length - 1) / 2) * sz * .3, y + sz * .02, sz * .36));
      return;
    }
    if (it.ch) {
      for (const [dx, dy] of [[-.18, .05], [.18, .08], [0, -.12]]) emo(EMO[it.k], x + dx * sz, y + dy * sz, sz * .38);
    } else emo(EMO[it.k], x, y, sz * .75);
  }
})();

// =====================================================================
// モード: おしくらまんじゅう
// 物理で押し合うため、このモードだけ移動もホスト権威(クライアントは入力だけ送る)
// =====================================================================
(() => {
  const R = 0.7, ROUNDS = 3, RAD0 = 8, RAD_MIN = 3.2, SHRINK = 40;
  const ACC = 24, FRIC = 2.2, DASH = 12, DASH_CD = 1.1;

  function startRound(S) {
    S.round++; S.phase = 'count'; S.count = 3.5; S.t = 0; S.rad = RAD0; S.msg = '';
    const n = S.players.length;
    S.players.forEach((p, i) => {
      const a = i / n * Math.PI * 2;
      Object.assign(p, { x: Math.cos(a) * 4.5, y: Math.sin(a) * 4.5, vx: 0, vy: 0, fx: -Math.cos(a), fy: -Math.sin(a),
        alive: true, fall: 0, cd: 0, dashT: 0, br: false });
    });
    S.entrants = n;
  }
  // CPU: 端に寄りすぎたら中央へ戻り、それ以外は一番近い相手へ向かってタックル
  function cpuInput(S, p) {
    const d0 = Math.hypot(p.x, p.y);
    let best = 1e9, tgt = null;
    for (const q of S.players) if (q !== p && q.alive) { const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < best) { best = d; tgt = q; } }
    const [tx, ty] = d0 > S.rad - 1.6 || !tgt ? [-p.x, -p.y] : [tgt.x - p.x, tgt.y - p.y];
    p.aiJ = (p.aiJ || 0) + (Math.random() - .5) * .3;
    const ang = Math.atan2(ty, tx) + Math.sin(p.aiJ) * .5;
    return { mx: Math.cos(ang), my: Math.sin(ang), dash: !!tgt && best < 2.6 && d0 < S.rad - 1.2 && Math.random() < .06, brace: false };
  }

  MODES.sumo = {
    create(players) {
      const S = { players: [], round: 0, ev: [], evId: 1, phase: 'count' };
      fillCpus(players, 4).forEach(p => this.addPlayer(S, p, true));
      startRound(S); return S;
    },
    addPlayer(S, p, initial) {
      // 途中参加は次のラウンドから
      S.players.push({ id: p.id, name: p.name, color: p.color, cpu: !!p.cpu, win: 0, x: 0, y: 0, vx: 0, vy: 0, fx: 0, fy: 1,
        alive: !!initial, fall: initial ? 0 : 9, cd: 0, dashT: 0, br: false, la: undefined });
    },
    removePlayer(S, id) { S.players = S.players.filter(p => p.id !== id); },
    initData() { return {}; },
    step(S, dt, inputs) {
      if (S.phase === 'over') return;
      if (S.phase === 'inter') { S.inter -= dt; if (S.inter <= 0) { if (S.round >= ROUNDS) S.phase = 'over'; else startRound(S); } return; }
      if (S.phase === 'count') { S.count -= dt; if (S.count <= 0) S.phase = 'play'; }
      const play = S.phase === 'play';
      for (const p of S.players) {
        let c = { mx: 0, my: 0, dash: false, brace: false };
        if (p.cpu) { if (play && p.alive) c = cpuInput(S, p); }
        else {
          const inp = inputs[p.id];
          if (inp) {
            c.mx = inp.mx; c.my = inp.my; c.brace = !!inp.gh;
            if (p.la === undefined) p.la = inp.a;
            if (inp.a !== p.la) { p.la = inp.a; c.dash = true; }
          }
        }
        if (!p.alive) { p.fall += dt; continue; }
        p.cd -= dt; p.dashT -= dt; p.br = play && c.brace;
        const ml = Math.hypot(c.mx, c.my);
        if (ml > .1) { p.fx = c.mx / ml; p.fy = c.my / ml; }
        if (play && !p.br) {
          p.vx += c.mx * ACC * dt; p.vy += c.my * ACC * dt;
          if (c.dash && p.cd <= 0) { p.vx += p.fx * DASH; p.vy += p.fy * DASH; p.cd = DASH_CD; p.dashT = .35; addEv(S, 'dash', p.x, p.y); }
        }
        const fr = Math.exp(-(p.br ? 7 : FRIC) * dt); p.vx *= fr; p.vy *= fr;
        p.x += p.vx * dt; p.y += p.vy * dt;
      }
      // 衝突: 反発係数を大きめにして派手に吹っ飛ばす(ふんばり中は重さ4倍)
      const al = S.players.filter(p => p.alive);
      for (let i = 0; i < al.length; i++) for (let j = i + 1; j < al.length; j++) {
        const a = al[i], b = al[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
        if (d >= R * 2 || d < 1e-6) continue;
        const nx = dx / d, ny = dy / d, ma = a.br ? 4 : 1, mb = b.br ? 4 : 1, ov = R * 2 - d;
        a.x -= nx * ov * mb / (ma + mb); a.y -= ny * ov * mb / (ma + mb);
        b.x += nx * ov * ma / (ma + mb); b.y += ny * ov * ma / (ma + mb);
        const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vn >= 0) continue;
        const e = a.dashT > 0 || b.dashT > 0 ? 1.7 : 1.0, jm = -(1 + e) * vn / (1 / ma + 1 / mb);
        a.vx -= jm / ma * nx; a.vy -= jm / ma * ny; b.vx += jm / mb * nx; b.vy += jm / mb * ny;
        if (-vn > 3) addEv(S, 'bump', (a.x + b.x) / 2, (a.y + b.y) / 2);
      }
      if (!play) return;
      S.t += dt; S.rad = Math.max(RAD_MIN, RAD0 - (RAD0 - RAD_MIN) * S.t / SHRINK);
      for (const p of al) if (Math.hypot(p.x, p.y) > S.rad + R * .3) { p.alive = false; p.fall = 0; addEv(S, 'fall', p.x, p.y, p.name + ' 落ちた!'); }
      const left = S.players.filter(p => p.alive);
      if (left.length <= (S.entrants > 1 ? 1 : 0)) {
        const w = left[0];
        if (w) w.win++;
        S.msg = w ? `${w.name} の勝ち!` : '引き分け!';
        addEv(S, 'win', 0, 0); S.phase = 'inter'; S.inter = 3.5;
      }
    },
    snapshot(S) {
      return { ph: S.phase, cnt: S.count, round: S.round, rounds: ROUNDS, rad: r2(S.rad), msg: S.msg, ev: S.ev,
        pl: S.players.map(p => ({ id: p.id, n: p.name, c: p.color, x: r2(p.x), y: r2(p.y), fx: r2(p.fx), fy: r2(p.fy),
          al: p.alive ? 1 : 0, fa: r2(p.fall), br: p.br ? 1 : 0, ds: p.dashT > 0 ? 1 : 0, w: p.win })) };
    },
    isOver(S) { return S.phase === 'over'; },
    result(S) {
      const rank = [...S.players].sort((a, b) => b.win - a.win);
      return { title: rank[0].win ? `${rank[0].name} の優勝!` : '引き分け!', rank: rank.map(p => [p.name, p.win + '勝', p.color]) };
    },
    clientFrame(app, inp, dt) { smoothPlayers(app, app.snap.pl, dt); playEvents(app, app.snap.ev); },
    inputMsg(app, inp) { return { mx: r2(inp.mx), my: r2(inp.my), a: inp.a, gh: inp.gh }; },
    render(app, dt, W, H) {
      const s = app.snap;
      if (!s) { label('接続中…', W / 2, H / 2, 30 * dpr, '#fff'); return; }
      const hud = 56 * dpr, u = Math.min(W, H - hud) / (2 * (RAD0 + 1.2)), cx = W / 2, cy = hud + (H - hud) / 2;
      const X = x => cx + x * u, Y = y => cy + y * u, now = performance.now() / 1000;
      // 海と波
      ctx.fillStyle = '#1f4f7a'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 2 * dpr;
      for (let i = 0; i < 12; i++) {
        const y = (i * 90 * dpr + now * 20 * dpr) % H;
        ctx.beginPath();
        for (let x = 0; x <= W; x += 20 * dpr) ctx.lineTo(x, y + Math.sin(x / (40 * dpr) + now * 2 + i) * 6 * dpr);
        ctx.stroke();
      }
      // 土俵(縮む)
      ctx.fillStyle = '#00000033'; ctx.beginPath(); ctx.arc(cx, cy, RAD0 * u, 0, 7); ctx.fill();
      ctx.fillStyle = '#e9cf98'; ctx.beginPath(); ctx.arc(cx, cy, s.rad * u, 0, 7); ctx.fill();
      ctx.strokeStyle = s.rad < RAD0 && s.ph === 'play' && Math.sin(now * 6) > 0 ? '#ff5252' : '#a8743a'; ctx.lineWidth = .35 * u;
      ctx.beginPath(); ctx.arc(cx, cy, s.rad * u, 0, 7); ctx.stroke();
      ctx.strokeStyle = '#ffffff66'; ctx.lineWidth = .08 * u;
      for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(X(sx * .8), Y(-.7)); ctx.lineTo(X(sx * .8), Y(.7)); ctx.stroke(); }
      // プレイヤー
      const list = s.pl.map(p => ({ p, x: (app.rp[p.id] || p).x, y: (app.rp[p.id] || p).y })).sort((a, b) => a.y - b.y);
      for (const { p, x, y } of list) {
        if (!p.al && p.fa > 1.2) continue;
        const sc = p.al ? 1 : Math.max(0, 1 - p.fa / 1.2), r = R * u * sc;
        if (p.ds) {
          ctx.strokeStyle = '#fffa'; ctx.lineWidth = 3 * dpr;
          for (const o of [-.3, 0, .3]) {
            const bx = x - p.fx * .7 - p.fy * o, by = y - p.fy * .7 + p.fx * o;
            ctx.beginPath(); ctx.moveTo(X(bx), Y(by)); ctx.lineTo(X(bx - p.fx * .6), Y(by - p.fy * .6)); ctx.stroke();
          }
        }
        drawBlob(X(x), Y(y), r, p.c, p.fx, p.fy, { ring: p.br ? '#fff' : (p.id === app.myId ? '#ffcf40' : null) });
        if (p.br) emo('💪', X(x) + r, Y(y) - r, r * .8);
        if (sc > .3) label(p.n + (p.w ? ' ' + '★'.repeat(p.w) : ''), X(x), Y(y) - r * 1.7, Math.max(11 * dpr, u * .38), p.id === app.myId ? '#ffcf40' : '#fff', '#000c');
      }
      drawFloaters(app, dt, X, Y, u);
      label(`ラウンド ${s.round} / ${s.rounds}`, W / 2, hud * .5, 22 * dpr, '#fff', '#000');
      label(`のこり ${s.pl.filter(p => p.al).length}人`, W - 70 * dpr, hud * .5, 18 * dpr, '#ffcf40', '#000');
      const mine = s.pl.find(p => p.id === app.myId);
      if (mine && !mine.al && s.ph === 'play') label('落ちちゃった… 観戦中', W / 2, H - 30 * dpr, 18 * dpr, '#fff', '#000');
      if (s.ph === 'inter') label(s.msg, W / 2, H / 2, Math.min(W, H) * .1, '#ffcf40', '#000');
      countdown(s, W, H);
    },
  };
})();

// =====================================================================
// モード: ばくだんリレー
// =====================================================================
(() => {
  const MAP = [
    '####################',
    '#..................#',
    '#..##..........##..#',
    '#..##....##....##..#',
    '#........##........#',
    '#..................#',
    '#......#....#......#',
    '#........##........#',
    '#..##....##....##..#',
    '#..##..........##..#',
    '#..................#',
    '####################',
  ];
  const SPAWNS = [[1.5, 1.5], [18.5, 10.5], [18.5, 1.5], [1.5, 10.5], [6.5, 5.5], [13.5, 5.5], [9.5, 1.5], [9.5, 10.5]];
  const R = .38, SPEED = 4.4, HOLDER_BONUS = 1.15, DASH = 9, DASH_CD = 1.6, ROUNDS = 3;
  const newFuse = () => 8 + Math.random() * 10;
  const alive = S => S.players.filter(p => p.alive);
  const pick = arr => arr[Math.random() * arr.length | 0];

  function startRound(S) {
    S.round++; S.phase = 'count'; S.count = 3.5; S.msg = '';
    const order = SPAWNS.map((s, i) => i).sort(() => Math.random() - .5);
    S.players.forEach((p, i) => {
      const sp = SPAWNS[order[i % SPAWNS.length]];
      Object.assign(p, { x: sp[0], y: sp[1], fx: 0, fy: 1, alive: true, sp: p.sp + 1 });
    });
    S.holder = pick(S.players).id; S.fuse = newFuse(); S.passT = 0; S.from = null; S.backT = 0;
  }
  // CPU: 爆弾持ちなら一番近い人を追い、そうでなければ爆弾持ちから逃げる
  function cpuMove(S, p, dt) {
    const h = S.players.find(q => q.id === S.holder);
    let gx = 0, gy = 0;
    if (p.id === S.holder) {
      let best = 1e9;
      for (const q of alive(S)) if (q !== p) { const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < best) { best = d; gx = q.x - p.x; gy = q.y - p.y; } }
    } else if (h) { gx = p.x - h.x; gy = p.y - h.y; }
    const gl = Math.hypot(gx, gy) || 1;
    p.aiT = (p.aiT || 0) - dt;
    if (p.aiT <= 0) { p.aiA = Math.random() * Math.PI * 2; p.aiT = .8 + Math.random(); }
    let vx = gx / gl + Math.cos(p.aiA) * .7, vy = gy / gl + Math.sin(p.aiA) * .7;
    const vl = Math.hypot(vx, vy) || 1; vx /= vl; vy /= vl;
    const sp = SPEED * (p.id === S.holder ? HOLDER_BONUS : .85), ox = p.x, oy = p.y;
    gridMove(MAP, p, vx * sp, vy * sp, dt, R);
    if (Math.hypot(p.x - ox, p.y - oy) < sp * dt * .3) p.aiT = 0;  // 引っかかったら向きを変える
    p.fx = vx; p.fy = vy;
  }

  MODES.bomb = {
    create(players) {
      const S = { players: [], round: 0, ev: [], evId: 1, phase: 'count' };
      fillCpus(players, 4).forEach(p => this.addPlayer(S, p, true));
      startRound(S); return S;
    },
    addPlayer(S, p, initial) {
      S.players.push({ id: p.id, name: p.name, color: p.color, cpu: !!p.cpu, win: 0, x: 9.5, y: 5.5, fx: 0, fy: 1, alive: !!initial, sp: 0 });
    },
    removePlayer(S, id) { S.players = S.players.filter(p => p.id !== id); },
    initData() { return {}; },
    step(S, dt, inputs) {
      if (S.phase === 'over') return;
      if (S.phase === 'inter') { S.inter -= dt; if (S.inter <= 0) { if (S.round >= ROUNDS) S.phase = 'over'; else startRound(S); } return; }
      if (S.phase === 'count') { S.count -= dt; if (S.count <= 0) S.phase = 'play'; }
      const play = S.phase === 'play';
      for (const p of S.players) {
        if (!p.alive) continue;
        if (p.cpu) { if (play) cpuMove(S, p, dt); continue; }
        const inp = inputs[p.id];
        if (!inp || inp.sp !== p.sp) continue;  // まだスポーン地点へ移っていない古い入力は無視
        p.x = inp.x; p.y = inp.y; p.fx = inp.fx; p.fy = inp.fy;
      }
      if (!play) return;
      S.passT -= dt; S.fuse -= dt;
      let h = S.players.find(p => p.id === S.holder && p.alive);
      if (!h) { h = pick(alive(S)); S.holder = h ? h.id : null; }
      if (!h) return;
      S.backT -= dt;
      if (S.passT <= 0) for (const q of alive(S)) {
        if (q === h || Math.hypot(q.x - h.x, q.y - h.y) > R * 2 + .1) continue;
        if (q.id === S.from && S.backT > 0) continue;  // 渡してきた相手にはすぐ返せない
        S.from = h.id; S.backT = 1.5;
        S.holder = q.id; S.passT = .6; addEv(S, 'pass', q.x, q.y - .6, 'パス!'); break;
      }
      if (S.fuse > 0) return;
      const v = S.players.find(p => p.id === S.holder);
      v.alive = false; addEv(S, 'boom', v.x, v.y - .6, `${v.name} ドカーン!`);
      const left = alive(S);
      if (left.length <= 1) {
        const w = left[0];
        if (w) w.win++;
        S.msg = w ? `${w.name} の勝ち!` : '引き分け!';
        addEv(S, 'win', 0, 0); S.phase = 'inter'; S.inter = 3.5;
      } else { S.holder = pick(left).id; S.fuse = newFuse(); S.passT = 1; }
    },
    snapshot(S) {
      return { ph: S.phase, cnt: S.count, round: S.round, rounds: ROUNDS, msg: S.msg, ho: S.holder,
        fz: S.fuse < 3 ? 2 : S.fuse < 6 ? 1 : 0, ev: S.ev,
        pl: S.players.map(p => ({ id: p.id, n: p.name, c: p.color, x: r2(p.x), y: r2(p.y), fx: r2(p.fx), fy: r2(p.fy), al: p.alive ? 1 : 0, sp: p.sp, w: p.win })) };
    },
    isOver(S) { return S.phase === 'over'; },
    result(S) {
      const rank = [...S.players].sort((a, b) => b.win - a.win);
      return { title: rank[0].win ? `${rank[0].name} の優勝!` : '引き分け!', rank: rank.map(p => [p.name, p.win + '勝', p.color]) };
    },
    clientFrame(app, inp, dt) {
      const s = app.snap;
      smoothPlayers(app, s.pl, dt); playEvents(app, s.ev);
      const mine = s.pl.find(p => p.id === app.myId);
      if (!mine) { app.me = null; return; }
      const me = syncMe(app, mine);
      if (me.la === null || s.ph !== 'play' || !mine.al) { me.la = inp.a; return; }
      const ml = Math.hypot(inp.mx, inp.my);
      if (ml > .2) { me.fx = inp.mx / ml; me.fy = inp.my / ml; }
      me.cd -= dt;
      if (inp.a !== me.la) { me.la = inp.a; if (me.cd <= 0) { me.dv = DASH; me.cd = DASH_CD; sfx('dash'); } }
      const sp = SPEED * (s.ho === app.myId ? HOLDER_BONUS : 1);
      gridMove(MAP, me, inp.mx * sp + me.fx * me.dv, inp.my * sp + me.fy * me.dv, dt, R);
      me.dv *= Math.exp(-8 * dt); if (me.dv < .3) me.dv = 0;
      for (const o of s.pl) {
        if (o.id === app.myId || !o.al) continue;
        const rp = app.rp[o.id] || o, dx = me.x - rp.x, dy = me.y - rp.y, d = Math.hypot(dx, dy);
        if (d < R * 2 && d > 1e-4) { me.x += dx / d * (R * 2 - d) * .5; me.y += dy / d * (R * 2 - d) * .5; gridCollide(MAP, me, R); }
      }
    },
    inputMsg(app) {
      const me = app.me; if (!me) return null;
      return { x: r2(me.x), y: r2(me.y), fx: r2(me.fx), fy: r2(me.fy), sp: me.sp };
    },
    render(app, dt, W, H) {
      const s = app.snap;
      if (!s) { label('接続中…', W / 2, H / 2, 30 * dpr, '#fff'); return; }
      const cols = MAP[0].length, rows = MAP.length, hud = 50 * dpr;
      const ts = Math.floor(Math.min(W / cols, (H - hud) / rows)), ox = (W - cols * ts) / 2, oy = hud + (H - hud - rows * ts) / 2;
      const X = x => ox + x * ts, Y = y => oy + y * ts, now = performance.now() / 1000;
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        if (MAP[y][x] === '.') { ctx.fillStyle = (x + y) % 2 ? '#5d8a4e' : '#669655'; ctx.fillRect(X(x), Y(y), ts, ts); }
        else { ctx.fillStyle = '#5a4636'; ctx.fillRect(X(x), Y(y), ts, ts); ctx.fillStyle = '#7b6350'; ctx.fillRect(X(x) + 1, Y(y) + 1, ts - 2, ts * .75); }
      }
      const pos = p => p.id === app.myId && app.me && p.al ? app.me : (app.rp[p.id] || p);
      const list = s.pl.map(p => ({ p, ...pos(p) })).sort((a, b) => b.p.al - a.p.al || a.y - b.y);
      for (const { p, x, y } of list) {
        const r = R * ts, isMe = p.id === app.myId;
        if (!p.al) { ctx.globalAlpha = .45; emo('👻', X(x), Y(y), r * 2); ctx.globalAlpha = 1; continue; }
        const holder = p.id === s.ho;
        if (holder) { ctx.fillStyle = `rgba(255,60,40,${.25 + .2 * Math.sin(now * (6 + s.fz * 6))})`; ctx.beginPath(); ctx.arc(X(x), Y(y), r * 1.8, 0, 7); ctx.fill(); }
        drawBlob(X(x), Y(y), r, p.c, isMe && app.me ? app.me.fx : p.fx, isMe && app.me ? app.me.fy : p.fy, { ring: isMe ? '#ffcf40' : null });
        if (holder) {
          const sh = s.fz * 1.5 * dpr * Math.sin(now * 50);
          emo('💣', X(x) + sh, Y(y) - r * 1.6, r * 1.6);
          if (Math.sin(now * 20) > 0) emo('✨', X(x) + r * .6 + sh, Y(y) - r * 2.4, r * .7);
        }
        label(p.n + (p.w ? ' ' + '★'.repeat(p.w) : ''), X(x), Y(y) - r * (holder ? 3 : 1.7), Math.max(11 * dpr, ts * .3), isMe ? '#ffcf40' : '#fff', '#000c');
      }
      drawFloaters(app, dt, X, Y, ts);
      label(`ラウンド ${s.round} / ${s.rounds}`, W / 2, hud * .5, 22 * dpr, '#fff', '#000');
      label(`のこり ${s.pl.filter(p => p.al).length}人`, W - 70 * dpr, hud * .5, 18 * dpr, '#ffcf40', '#000');
      const mine = s.pl.find(p => p.id === app.myId);
      if (s.ph === 'play' && mine) {
        if (!mine.al) label('ドカーン… 観戦中', W / 2, H - 24 * dpr, 18 * dpr, '#fff', '#000');
        else if (s.ho === app.myId) label('💣 だれかにぶつかって渡せ!', W / 2, H - 24 * dpr, 20 * dpr, '#ff5252', '#000');
      }
      if (s.ph === 'inter') label(s.msg, W / 2, H / 2, Math.min(W, H) * .1, '#ffcf40', '#000');
      countdown(s, W, H);
    },
  };
})();

// =====================================================================
// モード: ぬりぬりバトル (スプラトゥーン風チーム戦)
// =====================================================================
(() => {
  const MAP = [
    '##########################',
    '#........................#',
    '#..........#..#..........#',
    '#...##.....#..#.....##...#',
    '#...##..............##...#',
    '#.........######.........#',
    '#........................#',
    '#...#................#...#',
    '#........................#',
    '#.........######.........#',
    '#...##..............##...#',
    '#...##.....#..#.....##...#',
    '#..........#..#..........#',
    '#........................#',
    '##########################',
  ];
  const MW = MAP[0].length, MH = MAP.length;
  const TEAMS = [{ name: 'オレンジ', color: '#ff8a1f' }, { name: 'ブルー', color: '#3d7bff' }];
  const SPAWNS = [[[1.5, 7.5], [1.5, 6.5], [1.5, 8.5], [2.5, 7.5]], [[24.5, 7.5], [24.5, 6.5], [24.5, 8.5], [23.5, 7.5]]];
  const R = .36, SPEED = 4.2, SWIM = 7.2, ENEMY_SLOW = 2.2, SHOOT_SPEED = 3.4;
  const BULLET_V = 12, BULLET_LIFE = .5, FIRE_INT = .12, INK_COST = 3.5, DMG = 34, RESPAWN = 3, TIME = 90;
  const isFloor = (x, y) => gridAt(MAP, x, y) === '.';
  const cellOf = (paint, x, y) => isFloor(Math.floor(x), Math.floor(y)) ? paint[Math.floor(y) * MW + Math.floor(x)] : null;

  function paintCell(S, x, y, team) { if (isFloor(x, y)) S.paint[y * MW + x] = team; }
  function splash(S, x, y, team, rad) {
    for (let ty = Math.floor(y - rad); ty <= y + rad; ty++) for (let tx = Math.floor(x - rad); tx <= x + rad; tx++)
      if (Math.hypot(tx + .5 - x, ty + .5 - y) <= rad) paintCell(S, tx, ty, team);
  }
  function spawnPos(S, p) {
    const mates = S.players.filter(q => q.team === p.team);
    return SPAWNS[p.team][Math.max(0, mates.indexOf(p)) % 4];
  }
  function respawn(S, p) {
    const [x, y] = spawnPos(S, p);
    Object.assign(p, { x, y, fx: p.team ? -1 : 1, fy: 0, dead: false, dmg: 0, ink: 100, sp: p.sp + 1, sw: false });
  }
  // CPU: 近くの敵を撃つ。いなければ未塗りの場所へ歩いて塗る。インクが減ったら自陣へ戻って潜る
  function cpu(S, p, dt) {
    let tgt = null, best = 6;
    for (const q of S.players) if (q.team !== p.team && !q.dead && !q.sw) { const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < best) { best = d; tgt = q; } }
    if (p.ink < 15) p.refill = true; else if (p.ink > 90) p.refill = false;
    const here = cellOf(S.paint, p.x, p.y);
    if (p.refill && here === p.team) return { shoot: false, swim: true };
    p.aiT = (p.aiT || 0) - dt;
    if (p.refill) { const [x, y] = spawnPos(S, p); p.goal = { x, y }; }
    else if (!p.goal || p.aiT <= 0 || Math.hypot(p.goal.x - p.x, p.goal.y - p.y) < .8) {
      for (let i = 0; i < 30; i++) {
        const x = 1 + Math.random() * (MW - 2) | 0, y = 1 + Math.random() * (MH - 2) | 0;
        if (isFloor(x, y) && S.paint[y * MW + x] !== p.team) { p.goal = { x: x + .5, y: y + .5 }; break; }
      }
      p.aiT = 2.5 + Math.random() * 2;
    }
    let dx, dy;
    if (tgt && !p.refill) { dx = tgt.x - p.x; dy = tgt.y - p.y; if (best < 3) { const t = dx; dx = -dy; dy = t; } }
    else if (p.goal) { dx = p.goal.x - p.x; dy = p.goal.y - p.y; }
    else { dx = p.fx; dy = p.fy; }
    const l = Math.hypot(dx, dy) || 1;
    if (tgt && !p.refill) { const al = Math.hypot(tgt.x - p.x, tgt.y - p.y) || 1; p.fx = (tgt.x - p.x) / al; p.fy = (tgt.y - p.y) / al; }
    else { p.fx = dx / l; p.fy = dy / l; }
    const shoot = !p.refill && p.ink > INK_COST;
    const sp = here !== null && here !== -1 && here !== p.team ? ENEMY_SLOW : shoot ? SHOOT_SPEED : SPEED;
    const ox = p.x, oy = p.y;
    gridMove(MAP, p, dx / l * sp * .9, dy / l * sp * .9, dt, R);
    if (Math.hypot(p.x - ox, p.y - oy) < sp * dt * .2) p.aiT = 0;
    return { shoot, swim: false };
  }

  MODES.paint = {
    create(players) {
      const n = Math.max(4, players.length + players.length % 2);
      const list = fillCpus(players, n);
      const S = { players: [], paint: new Array(MW * MH).fill(-1), bullets: [], ev: [], evId: 1, phase: 'count', count: 3.5, time: TIME };
      // 人間を交互に振り分けてから CPU で埋める
      list.forEach((p, i) => this.addPlayer(S, p, i % 2));
      for (const t of [0, 1]) for (const [x, y] of SPAWNS[t]) splash(S, x, y, t, 1.6);
      return S;
    },
    addPlayer(S, p, team) {
      if (team === undefined) { const c0 = S.players.filter(q => q.team === 0).length; team = c0 <= S.players.length - c0 ? 0 : 1; }
      const q = { id: p.id, name: p.name, color: p.color, cpu: !!p.cpu, team, kills: 0, sp: 0, dmg: 0, ink: 100, fireT: 0, hurtT: 0 };
      S.players.push(q); respawn(S, q);
    },
    removePlayer(S, id) { S.players = S.players.filter(p => p.id !== id); },
    initData() { return {}; },
    step(S, dt, inputs) {
      if (S.phase === 'count') { S.count -= dt; if (S.count <= 0) S.phase = 'play'; }
      const play = S.phase === 'play';
      if (play) S.time -= dt;
      for (const p of S.players) {
        if (p.dead) { if (play && (p.rt -= dt) <= 0) { respawn(S, p); addEv(S, 'respawn', p.x, p.y); } continue; }
        let shoot = false, swim = false;
        if (p.cpu) { if (play) ({ shoot, swim } = cpu(S, p, dt)); }
        else {
          const inp = inputs[p.id];
          if (inp && inp.sp === p.sp) { p.x = inp.x; p.y = inp.y; p.fx = inp.fx; p.fy = inp.fy; shoot = !!inp.ah; swim = !!inp.gh; }
        }
        p.sw = swim && cellOf(S.paint, p.x, p.y) === p.team;
        p.ink = Math.min(100, p.ink + (p.sw ? 50 : 6) * dt);
        p.hurtT -= dt; if (p.hurtT <= 0) p.dmg = Math.max(0, p.dmg - 40 * dt);
        p.fireT -= dt;
        if (play && shoot && !p.sw && p.fireT <= 0 && p.ink >= INK_COST) {
          p.fireT = FIRE_INT; p.ink -= INK_COST;
          const a = Math.atan2(p.fy, p.fx) + (Math.random() - .5) * .18;
          S.bullets.push({ x: p.x + Math.cos(a) * .4, y: p.y + Math.sin(a) * .4, vx: Math.cos(a) * BULLET_V, vy: Math.sin(a) * BULLET_V, t: BULLET_LIFE, team: p.team, owner: p.id });
        }
      }
      // 弾: 通った床を塗り、壁・寿命で着弾して周りを塗る。敵に当たるとダメージ
      S.bullets = S.bullets.filter(b => {
        for (let k = 0; k < 2; k++) {
          const nx = b.x + b.vx * dt / 2, ny = b.y + b.vy * dt / 2;
          if (!isFloor(Math.floor(nx), Math.floor(ny))) { splash(S, b.x, b.y, b.team, 1.1); return false; }
          b.x = nx; b.y = ny; paintCell(S, Math.floor(b.x), Math.floor(b.y), b.team);
          for (const q of S.players) {
            if (q.dead || q.team === b.team || Math.hypot(q.x - b.x, q.y - b.y) > R + .12) continue;
            q.dmg += DMG; q.hurtT = 1.5;
            if (q.dmg >= 100) {
              const killer = S.players.find(o => o.id === b.owner);
              if (killer) killer.kills++;
              q.dead = true; q.rt = RESPAWN; splash(S, q.x, q.y, b.team, 1.6);
              addEv(S, 'splat', q.x, q.y - .6, `${killer ? killer.name : '?'} → ${q.name} たおした!`);
            } else addEv(S, 'hit', q.x, q.y);
            return false;
          }
        }
        if ((b.t -= dt) <= 0) { splash(S, b.x, b.y, b.team, 1.1); return false; }
        return true;
      });
    },
    snapshot(S) {
      return { ph: S.phase, cnt: S.count, tm: S.time, ev: S.ev,
        pa: S.paint.map(v => v < 0 ? '.' : v).join(''),
        bu: S.bullets.map(b => [r2(b.x), r2(b.y), b.team]),
        pl: S.players.map(p => ({ id: p.id, n: p.name, c: p.color, tm: p.team, x: r2(p.x), y: r2(p.y), fx: r2(p.fx), fy: r2(p.fy),
          dd: p.dead ? 1 : 0, rt: p.dead ? r2(p.rt) : 0, sw: p.sw ? 1 : 0, ink: Math.round(p.ink), dm: Math.round(p.dmg), sp: p.sp, k: p.kills })) };
    },
    isOver(S) { return S.phase === 'play' && S.time <= 0; },
    result(S) {
      const c = [0, 0]; for (const v of S.paint) if (v >= 0) c[v]++;
      const tot = (c[0] + c[1]) || 1, pct = c.map(v => Math.round(v / tot * 1000) / 10);
      const w = c[0] === c[1] ? -1 : c[0] > c[1] ? 0 : 1;
      return { title: w < 0 ? '引き分け!' : `${TEAMS[w].name}チームの勝ち!`,
        stats: [[TEAMS[0].name, pct[0] + '%'], [TEAMS[1].name, pct[1] + '%']],
        rank: [...S.players].sort((a, b) => b.kills - a.kills).map(p => [p.name, p.kills + 'キル', TEAMS[p.team].color]) };
    },
    clientFrame(app, inp, dt) {
      const s = app.snap;
      smoothPlayers(app, s.pl, dt); playEvents(app, s.ev);
      const mine = s.pl.find(p => p.id === app.myId);
      if (!mine) { app.me = null; return; }
      const me = syncMe(app, mine);
      me.sw = false;
      if (mine.dd || s.ph !== 'play') return;
      const ml = Math.hypot(inp.mx, inp.my);
      if (ml > .2) { me.fx = inp.mx / ml; me.fy = inp.my / ml; }
      const cell = s.pa[Math.floor(me.y) * MW + Math.floor(me.x)], own = cell === String(mine.tm);
      me.sw = inp.gh && own;
      const sp = me.sw ? SWIM : cell !== '.' && !own ? ENEMY_SLOW : inp.ah ? SHOOT_SPEED : SPEED;
      gridMove(MAP, me, inp.mx * sp, inp.my * sp, dt, R);
      for (const o of s.pl) {
        if (o.id === app.myId || o.dd) continue;
        const rp = app.rp[o.id] || o, dx = me.x - rp.x, dy = me.y - rp.y, d = Math.hypot(dx, dy);
        if (d < R * 2 && d > 1e-4) { me.x += dx / d * (R * 2 - d) * .5; me.y += dy / d * (R * 2 - d) * .5; gridCollide(MAP, me, R); }
      }
    },
    inputMsg(app, inp) {
      const me = app.me; if (!me) return null;
      return { x: r2(me.x), y: r2(me.y), fx: r2(me.fx), fy: r2(me.fy), sp: me.sp, ah: inp.ah, gh: inp.gh };
    },
    render(app, dt, W, H) {
      const s = app.snap;
      if (!s) { label('接続中…', W / 2, H / 2, 30 * dpr, '#fff'); return; }
      const hud = 56 * dpr;
      const ts = Math.floor(Math.min(W / MW, (H - hud) / MH)), ox = (W - MW * ts) / 2, oy = hud + (H - hud - MH * ts) / 2;
      const X = x => ox + x * ts, Y = y => oy + y * ts, now = performance.now() / 1000;
      const mine = s.pl.find(p => p.id === app.myId), myTeam = mine ? mine.tm : 0;
      for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
        if (MAP[y][x] !== '.') { ctx.fillStyle = '#2a2840'; ctx.fillRect(X(x), Y(y), ts, ts); ctx.fillStyle = '#3d3a5c'; ctx.fillRect(X(x) + 1, Y(y) + 1, ts - 2, ts * .75); continue; }
        const v = s.pa[y * MW + x];
        ctx.fillStyle = v === '.' ? ((x + y) % 2 ? '#d9d6e6' : '#cfcbe0') : TEAMS[+v].color;
        ctx.fillRect(X(x), Y(y), ts + .5, ts + .5);
      }
      for (const [bx, by, t] of s.bu) { ctx.fillStyle = TEAMS[t].color; ctx.strokeStyle = '#0006'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(X(bx), Y(by), ts * .14, 0, 7); ctx.fill(); ctx.stroke(); }
      for (const p of s.pl) {
        if (p.dd) continue;
        const isMe = p.id === app.myId, pos = isMe && app.me ? app.me : (app.rp[p.id] || p);
        const sw = isMe && app.me ? app.me.sw : p.sw, fx = isMe && app.me ? app.me.fx : p.fx, fy = isMe && app.me ? app.me.fy : p.fy;
        const r = R * ts, col = TEAMS[p.tm].color;
        if (sw) {
          // せんぷく中: 味方には薄く見え、敵にはほぼ見えない
          ctx.globalAlpha = p.tm === myTeam ? .55 : .08;
          ctx.fillStyle = col; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * dpr;
          ctx.beginPath(); ctx.ellipse(X(pos.x), Y(pos.y), r * 1.1, r * .45, Math.sin(now * 8) * .2, 0, 7); ctx.fill(); ctx.stroke();
          ctx.globalAlpha = 1;
          if (p.tm === myTeam) label(p.n, X(pos.x), Y(pos.y) - r * 1.2, Math.max(10 * dpr, ts * .26), isMe ? '#ffcf40' : '#fff', '#000c');
          continue;
        }
        drawBlob(X(pos.x), Y(pos.y), r, col, fx, fy, { ring: p.c });
        if (p.dm > 0) { ctx.fillStyle = `rgba(255,0,0,${p.dm / 200})`; ctx.beginPath(); ctx.arc(X(pos.x), Y(pos.y), r, 0, 7); ctx.fill(); }
        ctx.strokeStyle = '#333'; ctx.lineWidth = r * .3;  // 水鉄砲
        ctx.beginPath(); ctx.moveTo(X(pos.x + fx * R * .6), Y(pos.y + fy * R * .6)); ctx.lineTo(X(pos.x + fx * R * 1.5), Y(pos.y + fy * R * 1.5)); ctx.stroke();
        label(p.n, X(pos.x), Y(pos.y) - r * 1.7, Math.max(10 * dpr, ts * .28), isMe ? '#ffcf40' : '#fff', '#000c');
        if (isMe) bar(X(pos.x) - r, Y(pos.y) + r * 1.3, r * 2, ts * .14, p.ink / 100, col);
      }
      drawFloaters(app, dt, X, Y, ts);
      // HUD: 塗り面積バー・残り時間
      const c = [0, 0]; for (const ch of s.pa) if (ch !== '.') c[+ch]++;
      const tot = c[0] + c[1], bw = Math.min(W * .5, 360 * dpr), bx = W / 2 - bw / 2, by = hud * .55;
      ctx.fillStyle = '#0008'; rrect(bx, by, bw, hud * .3, hud * .15); ctx.fill();
      if (tot) {
        ctx.fillStyle = TEAMS[0].color; ctx.fillRect(bx, by, bw * c[0] / tot, hud * .3);
        ctx.fillStyle = TEAMS[1].color; ctx.fillRect(bx + bw - bw * c[1] / tot, by, bw * c[1] / tot, hud * .3);
      }
      const tm = Math.max(0, Math.ceil(s.tm));
      label(`${Math.floor(tm / 60)}:${String(tm % 60).padStart(2, '0')}`, W / 2, hud * .28, 22 * dpr, tm <= 10 && Math.sin(now * 8) > 0 ? '#ff5252' : '#fff', '#000');
      if (mine) label(`あなた: ${TEAMS[mine.tm].name}`, 70 * dpr, hud * .4, 14 * dpr, TEAMS[mine.tm].color, '#000');
      if (mine && mine.dd) label(`やられた! 復活まで ${Math.ceil(mine.rt)}`, W / 2, H / 2, Math.min(W, H) * .07, '#fff', '#000');
      countdown(s, W, H);
    },
  };
})();

// =====================================================================
// モード: 蚊の一生 2D
// ボウフラ(水たまりでエサを食べて羽化) → 成虫(人間の血を吸う) → 水たまりで産卵。
// たたかれたらアウトで、次の世代としてボウフラからやり直し。産んだ卵の数を競う。
// =====================================================================
(() => {
  const RW = 24, RH = 14, TIME = 150, RESPAWN = 4, FOOD_NEED = 4;
  const PUD = { x: 3, y: 10.6, r: 2.1 };
  const HX = [9, 14.5, 20], HY = 6.6;
  // 吸える場所: 顔は血が多いけどバレやすい、足は安全だけど少ない
  const SPOTS = [
    { name: '顔', dx: 0, dy: -3.1, blood: 1.4, itch: 1.8 },
    { name: '左腕', dx: -1.35, dy: -.3, blood: 1, itch: 1 },
    { name: '右腕', dx: 1.35, dy: -.3, blood: 1, itch: 1 },
    { name: '足', dx: 0, dy: 3.9, blood: .8, itch: .6 },
  ];
  const SPEED = 5, LARVA_SPEED = 2.2, DASH = 9, DASH_CD = 1.2, SUCK_R = .55, SLAP_R = 1.25, WARN_T = .9, AWAKE_T = 3.5;
  const spotPos = (hi, si) => [HX[hi] + SPOTS[si].dx, HY + SPOTS[si].dy];
  const inPud = (x, y, m = 0) => Math.hypot(x - PUD.x, y - PUD.y) <= PUD.r - m;
  function nearSpot(x, y) {
    for (let hi = 0; hi < HX.length; hi++) for (let si = 0; si < SPOTS.length; si++) {
      const [sx, sy] = spotPos(hi, si);
      if (Math.hypot(x - sx, y - sy) < SUCK_R) return { hi, si };
    }
    return null;
  }
  const randInPud = m => { const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * (PUD.r - m); return [PUD.x + Math.cos(a) * r, PUD.y + Math.sin(a) * r]; };
  const clampRoom = p => { p.x = clamp(p.x, .4, RW - .4); p.y = clamp(p.y, .4, RH - .4); };
  function confineLarva(p) {
    const dx = p.x - PUD.x, dy = p.y - PUD.y, d = Math.hypot(dx, dy), m = PUD.r - .3;
    if (d > m) { p.x = PUD.x + dx / d * m; p.y = PUD.y + dy / d * m; }
  }

  function rebirth(S, p) {
    const [x, y] = randInPud(.5);
    Object.assign(p, { x, y, lv: true, dead: false, food: 0, blood: 0, gen: p.gen + 1, sp: p.sp + 1, suck: false,
      greed: 60 + Math.random() * 40, brave: 75 + Math.random() * 40, alert: Math.random() < .55, tgt: null });
  }
  // CPU: ボウフラならエサへ。成虫なら人間の肌へ行って吸い、かゆいゲージが上がりすぎたら逃げる。満腹なら水たまりへ
  function cpuMove(S, p, dt) {
    let gx = p.x, gy = p.y, suck = false;
    // 油断している CPU は予告に気づかずたたかれる
    const danger = p.alert && S.humans.find(h => h.st === 'warn' && Math.hypot(h.sx - p.x, h.sy - p.y) < SLAP_R + .8);
    if (p.lv) {
      let best = 1e9;
      for (const f of S.food) { const d = Math.hypot(f[0] - p.x, f[1] - p.y); if (d < best) { best = d; gx = f[0]; gy = f[1]; } }
    } else if (danger) { gx = p.x + (p.x - danger.sx) * 3; gy = p.y + (p.y - danger.sy) * 3; p.tgt = null; }
    else if (p.blood >= p.greed) { gx = PUD.x; gy = PUD.y; }
    else {
      if (!p.tgt || S.humans[p.tgt.hi].st !== 'sleep') {
        const hs = S.humans.map((h, i) => i).filter(i => S.humans[i].st === 'sleep');
        p.tgt = hs.length ? { hi: hs[Math.random() * hs.length | 0], si: Math.random() * SPOTS.length | 0 } : null;
      }
      if (p.tgt) {
        [gx, gy] = spotPos(p.tgt.hi, p.tgt.si);
        if (Math.hypot(gx - p.x, gy - p.y) < SUCK_R * .7) {
          suck = true;
          if (S.humans[p.tgt.hi].itch > p.brave) { p.tgt = null; suck = false; }
        }
      } else { gx = RW / 2 + Math.sin(S.time) * 6; gy = 1.5; }
    }
    const dx = gx - p.x, dy = gy - p.y, d = Math.hypot(dx, dy);
    if (!suck && d > .05) {
      const sp = (p.lv ? LARVA_SPEED : SPEED * (1 - .4 * p.blood / 100)) * .85, step = Math.min(d, sp * dt);
      p.x += dx / d * step; p.y += dy / d * step; p.fx = dx / d; p.fy = dy / d;
    }
    if (p.lv) confineLarva(p); else clampRoom(p);
    return suck;
  }

  MODES.mosquito2d = {
    create(players) {
      const S = { players: [], humans: HX.map(() => ({ itch: 0, st: 'sleep', t: 0, sx: 0, sy: 0 })), food: [], foodT: 0,
        ev: [], evId: 1, phase: 'count', count: 3.5, time: TIME, slaps: 0 };
      fillCpus(players, 4).forEach(p => this.addPlayer(S, p));
      for (let i = 0; i < 10; i++) S.food.push(randInPud(.3));
      return S;
    },
    addPlayer(S, p) {
      const q = { id: p.id, name: p.name, color: p.color, cpu: !!p.cpu, eggs: 0, gen: 0, sp: 0, fx: 1, fy: 0 };
      S.players.push(q); rebirth(S, q);
    },
    removePlayer(S, id) { S.players = S.players.filter(p => p.id !== id); },
    initData() { return {}; },
    step(S, dt, inputs) {
      if (S.phase === 'count') { S.count -= dt; if (S.count <= 0) S.phase = 'play'; }
      const play = S.phase === 'play';
      if (!play) return;
      S.time -= dt;
      const sens = 1 + .6 * (1 - S.time / TIME);  // 後半ほど人間が敏感になる
      // 水たまりのエサ
      S.foodT -= dt;
      if (S.foodT <= 0 && S.food.length < 12) { S.food.push(randInPud(.3)); S.foodT = .4; }
      for (const h of S.humans) h.suckers = [];
      for (const p of S.players) {
        if (p.dead) { if ((p.rt -= dt) <= 0) { rebirth(S, p); addEv(S, 'emerge', p.x, p.y - .6, `${p.name} 第${p.gen}世代`); } continue; }
        let suckHeld = false;
        if (p.cpu) suckHeld = cpuMove(S, p, dt);
        else {
          const inp = inputs[p.id];
          if (inp && inp.sp === p.sp) { p.x = inp.x; p.y = inp.y; p.fx = inp.fx; p.fy = inp.fy; suckHeld = !!inp.ah; }
        }
        if (p.lv) {
          S.food = S.food.filter(f => {
            if (Math.hypot(f[0] - p.x, f[1] - p.y) > .5) return true;
            p.food++; return false;
          });
          if (p.food >= FOOD_NEED) { p.lv = false; addEv(S, 'emerge', p.x, p.y - .6, '羽化!'); }
          continue;
        }
        const ns = suckHeld && p.blood < 100 ? nearSpot(p.x, p.y) : null;
        p.suck = !!ns && S.humans[ns.hi].st === 'sleep';
        if (p.suck) {
          const sp = SPOTS[ns.si], h = S.humans[ns.hi];
          p.blood = Math.min(100, p.blood + 28 * sp.blood * dt);
          h.itch += 24 * sp.itch * sens * dt; h.suckers.push(p);
        } else {
          // 顔のまわりを飛ぶと「プ〜ン」で気づかれやすくなる
          for (let hi = 0; hi < HX.length; hi++) {
            const [fx, fy] = spotPos(hi, 0);
            if (S.humans[hi].st === 'sleep' && Math.hypot(p.x - fx, p.y - fy) < 1.6) S.humans[hi].itch += 5 * sens * dt;
          }
        }
        if (inPud(p.x, p.y) && p.blood >= 20) {
          const n = Math.round(p.blood / 8); p.eggs += n; p.blood = 0;
          addEv(S, 'lay', p.x, p.y - .6, `産卵! +${n}`);
        }
      }
      S.humans.forEach((h, hi) => {
        if (h.st === 'sleep') {
          if (!h.suckers.length) h.itch = Math.max(0, h.itch - 4 * dt);
          if (h.itch >= 100) {
            // たたく場所はこの瞬間に決まる。予告のあいだに逃げればセーフ
            const v = h.suckers[h.suckers.length - 1];
            const [fx, fy] = spotPos(hi, 0);
            Object.assign(h, { st: 'warn', t: WARN_T, sx: v ? v.x : fx, sy: v ? v.y : fy });
            addEv(S, 'warn', h.sx, h.sy - 1, '!?');
          }
        } else if (h.st === 'warn') {
          if ((h.t -= dt) <= 0) {
            let hit = 0;
            for (const p of S.players) {
              if (p.dead || p.lv || Math.hypot(p.x - h.sx, p.y - h.sy) > SLAP_R) continue;
              p.dead = true; p.rt = RESPAWN; p.blood = 0; p.suck = false; hit++;
              addEv(S, 'slap', p.x, p.y - .6, `${p.name} ペチッ!`);
            }
            S.slaps += hit;
            if (!hit) addEv(S, 'slap', h.sx, h.sy - .6, 'スカッ');
            Object.assign(h, { st: 'awake', t: AWAKE_T, itch: 25 });
          }
        } else if ((h.t -= dt) <= 0) h.st = 'sleep';
      });
    },
    snapshot(S) {
      return { ph: S.phase, cnt: S.count, tm: S.time, ev: S.ev,
        fd: S.food.map(f => [r2(f[0]), r2(f[1])]),
        hu: S.humans.map(h => ({ it: Math.round(h.itch), st: h.st, t: r2(h.t), sx: r2(h.sx), sy: r2(h.sy) })),
        pl: S.players.map(p => ({ id: p.id, n: p.name, c: p.color, x: r2(p.x), y: r2(p.y), fx: r2(p.fx), fy: r2(p.fy), sp: p.sp,
          lv: p.lv ? 1 : 0, dd: p.dead ? 1 : 0, rt: p.dead ? r2(p.rt) : 0, bl: Math.round(p.blood), eg: p.eggs, gen: p.gen, fo: p.food, sk: p.suck ? 1 : 0 })) };
    },
    isOver(S) { return S.phase === 'play' && S.time <= 0; },
    result(S) {
      const rank = [...S.players].sort((a, b) => b.eggs - a.eggs);
      const total = rank.reduce((a, p) => a + p.eggs, 0);
      return { title: rank[0].eggs ? `${rank[0].name} の子孫が一番ふえた!` : '全滅…',
        stats: [['合計の卵', total + '個'], ['ペチッ', S.slaps + '回']],
        rank: rank.map(p => [p.name, `${p.eggs}個 (第${p.gen}世代)`, p.color]) };
    },
    clientFrame(app, inp, dt) {
      const s = app.snap;
      smoothPlayers(app, s.pl, dt); playEvents(app, s.ev);
      const mine = s.pl.find(p => p.id === app.myId);
      if (!mine) { app.me = null; return; }
      const me = syncMe(app, mine);
      if (me.la === null || s.ph !== 'play' || mine.dd) { me.la = inp.a; me.vx = me.vy = 0; if (!isTouch) setHint(mine.dd ? 'ペチッ… 次の世代に生まれ変わるのを待とう' : ''); return; }
      const ml = Math.hypot(inp.mx, inp.my);
      if (ml > .2) { me.fx = inp.mx / ml; me.fy = inp.my / ml; }
      // ふわふわ飛ぶ(慣性あり)。吸っている間はその場に止まる
      const landing = inp.ah && !mine.lv;
      const sp = mine.lv ? LARVA_SPEED : landing ? SPEED * .15 : SPEED * (1 - .4 * mine.bl / 100);
      me.vx = me.vx || 0; me.vy = me.vy || 0;
      const k = Math.min(1, (mine.lv ? 8 : 6) * dt);
      me.vx += (inp.mx * sp - me.vx) * k; me.vy += (inp.my * sp - me.vy) * k;
      me.cd -= dt;
      if (inp.g !== me.lg) { if (me.lg != null && !mine.lv && me.cd <= 0) { me.dv = DASH; me.cd = DASH_CD; sfx('dash'); } me.lg = inp.g; }
      me.x += (me.vx + me.fx * me.dv) * dt; me.y += (me.vy + me.fy * me.dv) * dt;
      me.dv *= Math.exp(-7 * dt); if (me.dv < .3) me.dv = 0;
      if (mine.lv) confineLarva(me); else clampRoom(me);
      if (!isTouch) {
        const danger = s.hu.find(h => h.st === 'warn' && Math.hypot(h.sx - me.x, h.sy - me.y) < SLAP_R + .5);
        const ns = nearSpot(me.x, me.y);
        setHint(mine.lv ? `ボウフラ: 水たまりのエサ🦠を食べて羽化しよう (${mine.fo}/${FOOD_NEED})`
          : danger ? '✋ たたかれる!Space でダッシュして逃げて!'
          : mine.bl >= 100 ? '満腹!みずたまりへ戻って産卵しよう'
          : ns && s.hu[ns.hi].st === 'sleep' ? `${SPOTS[ns.si].name}: Shift 長押しで吸う!(かゆいゲージに注意)`
          : mine.bl >= 20 ? '人間の肌で吸う / みずたまりで産卵(血が多いほど卵が増える)'
          : '人間の肌(顔・腕・足)に近づいて血を吸おう');
      }
    },
    inputMsg(app, inp) {
      const me = app.me; if (!me) return null;
      return { x: r2(me.x), y: r2(me.y), fx: r2(me.fx), fy: r2(me.fy), sp: me.sp, ah: inp.ah };
    },
    render(app, dt, W, H) {
      const s = app.snap;
      if (!s) { label('接続中…', W / 2, H / 2, 30 * dpr, '#fff'); return; }
      const hud = 52 * dpr, u = Math.min(W / RW, (H - hud) / RH), ox = (W - RW * u) / 2, oy = hud + (H - hud - RH * u) / 2;
      const X = x => ox + x * u, Y = y => oy + y * u, now = performance.now() / 1000;
      // 畳の部屋
      ctx.fillStyle = '#cfd39a'; ctx.fillRect(X(0), Y(0), RW * u, RH * u);
      ctx.strokeStyle = '#a9ad73'; ctx.lineWidth = Math.max(1, u * .05);
      for (let y = 0; y < RH; y += 3.5) for (let x = (y / 3.5) % 2 ? 0 : -3.5; x < RW; x += 7) ctx.strokeRect(X(Math.max(0, x)), Y(y), (Math.min(RW, x + 7) - Math.max(0, x)) * u, 3.5 * u);
      ctx.strokeStyle = '#6b4f2a'; ctx.lineWidth = u * .3; ctx.strokeRect(X(0), Y(0), RW * u, RH * u);
      // 水たまり

  };

  function drawMosquito(x, y, s, color, fx, fy, blood, now) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(fy, fx));
    const fl = Math.abs(Math.sin(now * 55));

    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.ellipse(-.05 * s, sd * .2 * s, .26 * s, (.06 + .07 * fl) * s, sd * .5, 0, 7); ctx.fill(); ctx.stroke(); }

    ctx.fillStyle = color; ctx.strokeStyle = '#0008'; ctx.beginPath(); ctx.arc(.03 * s, 0, .09 * s, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(.14 * s, 0, .055 * s, 0, 7); ctx.fill();
    ctx.strokeStyle = '#111'; ctx.lineWidth = Math.max(1, .02 * s); ctx.beginPath(); ctx.moveTo(.18 * s, 0); ctx.lineTo(.42 * s, 0); ctx.stroke();

  function drawLarva(x, y, u, color, fx, fy, now) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(fy, fx));
    ctx.strokeStyle = '#6b4f2a'; ctx.lineWidth = u * .1; ctx.lineCap = 'round';

})();

// =====================================================================
// 3D 共通: three.js の遅延読み込み・共有レンダラー・人間モデル
// THREE は読み込み後にしか使えないので、ここで THREE のオブジェクトを最上位で作らないこと
// =====================================================================
const T3 = (() => {
  let state = 0, renderer = null;  // state 0: 未読込, 1: 読込中, 2: 完了, -1: 失敗
  function ensure() {
    if (window.THREE) return true;
    if (state === 0) {
      state = 1;
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js';
      sc.onload = () => { state = 2; };
      sc.onerror = () => { state = -1; toast('3Dの読み込みに失敗しました'); };
      document.head.appendChild(sc);
    }
    return false;
  }
  // #cv3 は1枚なので WebGL レンダラーは全 3D モードで共有する
  function getRenderer() {
    if (!renderer) renderer = new THREE.WebGLRenderer({ canvas: $('#cv3'), antialias: !isTouch });
    return renderer;
  }
  // スマホのボタン領域を避けたビューポートに合わせる
  function fit(camera, W, H) {
    const r = getRenderer(), cssW = cv.clientWidth, cssH = cv.clientHeight;
    r.setPixelRatio(Math.min(dpr, isTouch ? 1.5 : 2));
    r.setSize(cssW, cssH, false);
    r.setViewport(0, cssH - H / dpr, W / dpr, H / dpr);
    r.setScissor(0, cssH - H / dpr, W / dpr, H / dpr); r.setScissorTest(true);
    camera.aspect = W / H; camera.updateProjectionMatrix();
    return r;
  }
  const std = (c, rough = .75, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, metalness: 0, ...o });
  const V3 = a => new THREE.Vector3(a[0], a[1], a[2]);
  const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  function setLimb(m, a, b) {
    const va = V3(a), d = V3(b).sub(va), len = d.length() || .001;
    m.position.copy(va).addScaledVector(d, .5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    m.scale.set(1, len / m.userData.len, 1);
  }
  function limb(g, a, b, r, material) {
    const len = Math.max(.001, dist(a, b));
    const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, 12), material);
    m.userData.len = len; setLimb(m, a, b); g.add(m); return m;
  }
  function ball(g, p, r, material, sc = [1, 1, 1]) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), material);
    m.position.set(p[0], p[1], p[2]); m.scale.set(sc[0], sc[1], sc[2]); g.add(m); return m;
  }
  function box(g, p, s, material) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), material);
    m.scale.set(s[0], s[1], s[2]); m.position.set(p[0], p[1], p[2]); g.add(m); return m;
  }
  // 顔: 目・眉・鼻・口・耳・あご + 髪型 (L.style: dad / granny / girl / short / bald / long) + 鉢巻 (L.band) + メガネ (L.glasses)
  function makeHead(L, M) {
    const g = new THREE.Group(), dark = std('#2a1d18'), white = std('#fafafa', .4);
    ball(g, [0, 0, 0], .105, M.skin, [1, 1.12, 1.02]);
    ball(g, [0, -.06, .03], .078, M.skin, [1, .82, 1]);
    for (const sd of [-1, 1]) ball(g, [sd * .105, -.005, -.005], .026, M.skin, [.45, 1, .8]);
    ball(g, [0, -.012, .112], .018, M.skin, [.85, 1, 1.3]);
    const mouth = box(g, [0, -.055, .1], [.04, .007, .006], std('#a4524a'));
    const brows = [], cheeks = [], eyes = [];
    for (const sd of [-1, 1]) {
      if (L.eyes === 'open') { eyes.push(ball(g, [sd * .04, .02, .093], .017, white)); ball(g, [sd * .04, .02, .108], .009, dark); }
      else { const lid = box(g, [sd * .04, .017, .104], [.032, .004, .005], dark); lid.rotation.z = sd * -.15; }
      const brow = box(g, [sd * .042, .05, .1], [.036, .007, .008], std(L.hair === '#d4d4d4' ? '#9a9a9a' : L.hair));
      brow.userData.sd = sd; brows.push(brow);
      cheeks.push(ball(g, [sd * .06, -.03, .085], .022, new THREE.MeshBasicMaterial({ color: '#ff3b3b', transparent: true, opacity: 0, depthWrite: false }), [1, .7, .4]));
    }
    const hairM = std(L.hair, .9);
    if (L.style !== 'bald') {
      const cap = new THREE.Mesh(new THREE.SphereGeometry(.116, 20, 12, 0, Math.PI * 2, 0, Math.PI * .52), hairM);
      cap.position.set(0, .012, -.01); cap.rotation.x = -.35; cap.scale.set(1.02, 1.12, 1.06); g.add(cap);
    } else ball(g, [0, -.02, -.07], .1, hairM, [1.05, .6, .5]);
    if (L.style === 'dad') box(g, [0, -.036, .112], [.06, .012, .012], hairM);
    else if (L.style === 'granny') ball(g, [0, .07, -.1], .05, hairM);
    else if (L.style === 'girl' || L.style === 'long') {
      ball(g, [0, -.03, -.05], .11, hairM, [1.04, L.style === 'long' ? 1.5 : 1.15, .7]);
      for (const sd of [-1, 1]) ball(g, [sd * .095, -.04, .02], .04, hairM, [.5, L.style === 'long' ? 2.2 : 1.6, .9]);
      if (L.style === 'girl') limb(g, [0, .06, -.11], [0, -.1, -.2], .028, hairM);
    }
    if (L.band) { const band = new THREE.Mesh(new THREE.TorusGeometry(.112, .016, 8, 24), std(L.band, .8)); band.rotation.x = Math.PI / 2 - .25; band.position.set(0, .045, -.01); g.add(band); }
    if (L.glasses) for (const sd of [-1, 1]) { const rim = new THREE.Mesh(new THREE.TorusGeometry(.024, .003, 6, 16), std('#222', .4)); rim.position.set(sd * .04, .02, .113); g.add(rim); }
    return { g, brows, cheeks, eyes, mouth };
  }
  // 関節 J の間をカプセルでつないだ人間。body.pose(J2) で全身のポーズを付け直せる(お辞儀・歩き・食べるなど)
  //   L: skin / top / bottom / hair / style / torsoR / sleeves(none|short|long) / legs(shorts|long) / belly(骨盤からの相対) / eyes / headRot [x, y]
  function makeHuman(g, J, L) {
    const M = { skin: std(L.skin, .55), top: std(L.top), bottom: std(L.bottom), shoe: std(L.shoe || L.skin, .6) };
    const segs = [];
    const seg = (a, b, r, mat, t = 1) => { const m = limb(g, J[a], t === 1 ? J[b] : lerp3(J[a], J[b], t), r, mat); segs.push({ m, a, b, t }); return m; };
    const torso = seg('pelvis', 'neckB', L.torsoR, M.top);
    seg('shR', 'shL', .06, M.top); seg('hipR', 'hipL', .085, M.bottom);
    seg('neckB', 'head', .045, M.skin, .55);
    for (const s of ['R', 'L']) {
      if (L.sleeves === 'long') seg('sh' + s, 'el' + s, .048, M.top);
      else if (L.sleeves === 'short') { seg('sh' + s, 'el' + s, .056, M.top, .5); seg('sh' + s, 'el' + s, .042, M.skin); }
      else seg('sh' + s, 'el' + s, .045, M.skin);
      seg('el' + s, 'ha' + s, L.sleeves === 'long' ? .043 : .038, L.sleeves === 'long' ? M.top : M.skin);
      if (L.legs === 'shorts') { seg('hip' + s, 'kn' + s, .078, M.bottom, .55); seg('hip' + s, 'kn' + s, .062, M.skin); }
      else seg('hip' + s, 'kn' + s, .075, M.bottom);
      seg('kn' + s, 'an' + s, L.legs === 'long' ? .062 : .05, L.legs === 'long' ? M.bottom : M.skin);
      seg('an' + s, 'to' + s, .04, M.shoe);
    }
    const hands = [ball(g, J.haR, .042, M.skin, [.9, .62, 1.25]), ball(g, J.haL, .042, M.skin, [.9, .62, 1.25])];
    const belly = L.belly ? ball(g, add3(J.pelvis, L.belly), .135, M.top, [1.05, 1, 1]) : null;
    const head = makeHead(L, M);
    g.add(head.g);
    const body = { J, segs, torso, hands, head, M,
      pose(P) {
        for (const s of segs) setLimb(s.m, P[s.a], s.t === 1 ? P[s.b] : lerp3(P[s.a], P[s.b], s.t));
        hands[0].position.set(...P.haR); hands[1].position.set(...P.haL);
        if (belly) belly.position.set(...add3(P.pelvis, L.belly));
        head.g.position.set(...P.head);
        head.g.rotation.set(L.headRot[0] + (P.hx || 0), L.headRot[1] + (P.hy || 0), 0, 'YXZ');
      } };
    body.pose(J);
    return body;
  }
  // 骨盤を中心に上半身を x 軸まわりに倒した関節を返す(お辞儀・前かがみ)
  const UPPER = ['neckB', 'head', 'shR', 'shL', 'elR', 'elL', 'haR', 'haL'];
  function lean(J, ang) {
    const P = { ...J }, c = J.pelvis, cs = Math.cos(ang), sn = Math.sin(ang);
    for (const k of UPPER) { const y = J[k][1] - c[1], z = J[k][2] - c[2]; P[k] = [J[k][0], c[1] + y * cs - z * sn, c[2] + y * sn + z * cs]; }
    P.hx = (J.hx || 0) + ang;
    return P;
  }
  return { ensure, getRenderer, fit, std, V3, lerp3, add3, dist, setLimb, limb, ball, box, makeHead, makeHuman, lean };
})();

// =====================================================================
// モード: 蚊の一生 3D (PS2「蚊」風)

// ルール: coop 協力 / vs 対戦 / human 1人が「とうさん」を操作してたたく

(() => {
  const RW = 8, RD = 6, RH = 2.6, MR = .06;               // 部屋 (x, z, 高さ) と蚊の当たり半径
  const TURN = 2.4, FWD = 1.7, BACK = .9, UP = 1.1, SINK = .45;

  //   spots: 吸える場所 (b: 血の量の倍率, s: ストレスの倍率) / relax: ツボの候補
  //   look : 見た目(服・髪型・顔の向き)。sens: 敏感さ
  const HUMANS = [
    { name: 'とうさん', ox: 3.2, oz: .75, center: [0, .75, .2], head: [0, 1.15, .03], sens: 1,
      J: { head: [0, 1.15, .03], neckB: [0, .97, -.01], pelvis: [0, .52, 0],
        shR: [.18, .93, 0], shL: [-.18, .93, 0], elR: [.24, .7, .04], elL: [-.24, .7, .04], haR: [.17, .62, .32], haL: [-.17, .62, .3],

      case 'empty':
        if (seat.open && (seat.spawnT -= dt) <= 0) newCustomer(S, seat);
        return;
      case 'enter': if ((seat.t -= dt) <= 0) { seat.st = 'sheet'; seat.t = 3 + Math.random() * 2; } return;
      case 'sheet': if ((seat.t -= dt) <= 0) { seat.st = 'call'; setPat(seat); seatEv(S, 'call', seat, '🔔 呼び出し'); } return;
      case 'call': case 'wait': case 'kaecall': case 'kaewait':

        if (seat.nr && seat.st !== 'call' && seat.st !== 'kaecall') c.sat -= .5 * dt;  // 暖簾が上がりっぱなし
