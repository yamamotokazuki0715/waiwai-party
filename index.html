      const stool = new THREE.Mesh(new THREE.CylinderGeometry(.17, .17, .05, 20), std('#7a1f1f', .6)); stool.position.set(x, .6, 2.15); scene.add(stool);
      boxM(scene, [x, .3, 2.15], [.05, .58, .05], M.black);
      const lamp = boxM(scene, [x, 1.5, 1.25], [.12, .06, .03], std('#331111', .4, { emissive: '#000000' }));
      plane(.22, .16, [x, 1.62, 1.255], 0, Math.PI, std('#ffffff', .7, { map: textTex([String(NS - i)], 64, 48, '#1b1b1b', '#f0e0c0', 'bold 34px sans-serif') }));
      const noren = new THREE.Group();
      for (const sd of [-1, 1]) {
        const cloth = new THREE.Mesh(new THREE.PlaneGeometry(.3, .4), std('#ffffff', .9, { map: norenTex, side: THREE.DoubleSide }));
        cloth.position.set(sd * .155, -.2, 0); noren.add(cloth);
      }
      noren.position.set(x, 1.35, 1.25); scene.add(noren);
      const closed = plane(.5, .3, [x, 1.05, 1.27], 0, Math.PI, std('#ffffff', .8, { map: textTex(['準備中'], 128, 64, '#2b2b2b', '#bbbbbb', 'bold 30px serif') }));
      seats.push({ lamp, noren, closed, cust: null, cid: 0, bowl: null, bowlKey: '' });
    }
    // 厨房: ステンレスの作業台と設備
    boxM(scene, [10.3, .45, -.68], [4.2, .9, .45], M.steel);
    boxM(scene, [12.15, .45, 1.2], [.45, .9, 2.6], M.steel);
    boxM(scene, [10.2, .45, 2.3], [3.6, .9, .4], M.steel);
    boxM(scene, [4.1, .45, -.75], [8.2, .9, .3], std('#ffffff', .8, { map: wallWood }));
    for (let k = 0; k < 6; k++) { const b = makeBowl({ k: 'bowl', soup: -1, men: -1, negi: 2 }); b.position.set(8.8, .9 + k * .03, -.6); scene.add(b); }
    boxM(scene, [9.75, 1.0, -.65], [.75, .22, .4], std('#9aa3ad', .35, { metalness: .5 }));
    const baskets = [0, 1, 2].map(k => { const m = new THREE.Mesh(new THREE.CylinderGeometry(.08, .07, .12, 16, 1, true), std('#d0d0d0', .4, { side: THREE.DoubleSide, metalness: .4 })); m.position.set(9.5 + k * .25, 1.15, -.6); scene.add(m); return m; });
    for (const [id, col] of [['soupA', '#d39b56'], ['soupK', '#b97a3c']]) {
      const [x, z] = STATIONS[id].p;
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(.22, .2, .36, 24, 1, true), std('#a8aeb5', .3, { side: THREE.DoubleSide, metalness: .6 })); pot.position.set(x, 1.08, z - .22); scene.add(pot);
      const surf = new THREE.Mesh(new THREE.CircleGeometry(.21, 24), std(col, .3)); surf.rotation.x = -Math.PI / 2; surf.position.set(x, 1.22, z - .22); scene.add(surf);
    }
    for (const [id, col] of [['negiA', '#3f9a3a'], ['negiS', '#f2f2e0'], ['chashu', '#b8765c'], ['egg', '#fafafa']]) {
      const [x, z] = STATIONS[id].p, side = id === 'egg';
      const px = side ? x : x + .32, pz = side ? z + .25 : z;
      boxM(scene, [px, .93, pz], [.3, .06, .3], M.steel);
      boxM(scene, [px, .96, pz], [.26, .02, .26], std(col, .6));
    }
    const sink = boxM(scene, [10.1, .91, 2.3], [.6, .02, .3], std('#5d8fb0', .1, { metalness: .3 }));
    const trash = new THREE.Mesh(new THREE.CylinderGeometry(.18, .15, .6, 16), std('#2b4a2b', .7)); trash.position.set(9.1, .3, 2.35); scene.add(trash);
    // 湯気
    const steam = [], sTex = steamTex();
    for (let k = 0; k < 18; k++) {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: sTex, transparent: true, depthWrite: false }));
      const src = k % 3 === 0 ? [9.75, -.6] : k % 3 === 1 ? [10.65, -.62] : [11.35, -.62];
      sp.userData = { src, ph: Math.random() }; scene.add(sp); steam.push(sp);
    }
    // 店員の手に持つもの
    G = { scene, camera, seats, baskets, steam, staff: {}, init: app.init, camPos: null, sign };
  }
  function staffMesh(p) {
    const g = new THREE.Group();
    const L = { skin: '#e2b08a', top: '#161616', bottom: '#202020', shoe: '#0c0c0c', hair: '#1a1a1a', style: 'short', torsoR: .12,
      sleeves: 'short', legs: 'long', eyes: 'open', headRot: [0, 0], band: p.c };
    const body = T3.makeHuman(g, { ...STAND }, L);
    T3.box(g, [0, .75, .13], [.34, .55, .02], T3.std('#2a2a2a', .9));  // 前掛け
    G.scene.add(g);
    return { g, body, held: null, heldKey: '' };
  }
  function draw(app, s, dt, W, H) {
    if (!G || G.init !== app.init) build(app);
    const { scene, camera } = G, now = performance.now() / 1000, me = app.me;
    const renderer = T3.fit(camera, W, H);
    // 席
    s.se.forEach((se, i) => {
      const o = G.seats[i], x = SX(i);
      o.closed.visible = !se.op;
      const calling = se.st === 'call' || se.st === 'kaecall';
      o.lamp.material.emissive.set(calling ? (Math.sin(now * 8) > 0 ? '#ff2a2a' : '#661010') : se.st === 'wait' || se.st === 'kaewait' ? '#553300' : '#000000');
      // 暖簾: 上げると巻き上がる
      const up = se.nr ? 1 : 0; o.nrK = (o.nrK || 0) + (up - (o.nrK || 0)) * Math.min(1, 10 * dt);
      o.noren.scale.y = 1 - .85 * o.nrK; o.noren.children.forEach(c => { c.rotation.y = Math.sin(now * 1.3 + i) * .04 * (1 - o.nrK); });
      // 客
      const seated = ['sheet', 'call', 'wait', 'eating', 'kaecall', 'kaewait'].includes(se.st);
      const walking = se.st === 'enter' || se.st === 'leave';
      if ((seated || walking) && se.ty >= 0) {
        if (!o.cust || o.cid !== se.cid) { if (o.cust) scene.remove(o.cust.g); o.cust = makeCustomer(se.ty); o.cid = se.cid; scene.add(o.cust.g); }
        const B = o.cust.body;
        if (seated) {
          o.cust.g.position.set(x, 0, 2.12); o.cust.g.rotation.y = Math.PI;
          let P = { ...SIT };
          if (se.st === 'sheet') { P = T3.lean(SIT, .25); P.haR = [.05, .79, .38]; P.hx = .5; }
          if (se.st === 'eating') {
            const ph = (Math.sin(now * 2.2 + i) + 1) / 2;
            P = T3.lean(SIT, .32 - .15 * ph);
            P.haR = T3.lerp3([.04, .84, .48], [.03, 1.08, .2], ph); P.haL = [-.1, .8, .45];
            if (se.dis && se.nr) { P = T3.lean(SIT, -.2); P.haR = [.15, 1.05, .25]; P.haL = [-.15, 1.05, .25]; P.hx = -.3; }
          }
          if (se.st === 'wait' || se.st === 'kaewait') P.hx = .1 * Math.sin(now * .7 + i);
          B.pose(P);
        } else {
          // 入口と席のあいだを歩く
          const k = se.st === 'enter' ? 1 - se.t / 3 : se.t / 3, seatP = [x, 2.6];
          const pos = k < .7 ? T3.lerp3([DOOR[0], 0, DOOR[1]], [seatP[0], 0, 3.1], k / .7) : T3.lerp3([seatP[0], 0, 3.1], [x, 0, 2.6], (k - .7) / .3);
          o.cust.g.position.set(pos[0], 0, pos[2]);
          o.cust.g.rotation.y = k < .7 ? (se.st === 'enter' ? Math.PI / 2 : -Math.PI / 2) : (se.st === 'enter' ? Math.PI : 0);
          B.pose(walkPose(now * 7 + i));
        }
        B.head.cheeks.forEach(c => { c.material.opacity = se.sat < 40 ? .5 : 0; });
        B.head.brows.forEach(b => { b.rotation.z = se.sat < 35 ? b.userData.sd * .4 : 0; });
      } else if (o.cust) { scene.remove(o.cust.g); o.cust = null; }
      // カウンターの丼
      const bowl = se.st === 'dirty' ? { k: 'dirty' } : (se.st === 'eating' || se.st === 'kaecall' || se.st === 'kaewait') ? se.bw : null;
      const key = bowl ? JSON.stringify(bowl) : '';
      if (key !== o.bowlKey) { if (o.bowl) scene.remove(o.bowl); o.bowl = bowl ? makeBowl(bowl) : null; if (o.bowl) { o.bowl.position.set(x, .775, 1.55); scene.add(o.bowl); } o.bowlKey = key; }
    });
    // 麺ゆでのざる(茹で中は沈む)
    s.bk.forEach((t, k) => { G.baskets[k].position.y = t >= 0 ? 1.05 + Math.sin(now * 6 + k) * .005 : 1.18; });
    // 湯気
    G.steam.forEach(sp => {
      const u = (now * .25 + sp.userData.ph) % 1, [sx, sz] = sp.userData.src;
      sp.position.set(sx + Math.sin(u * 6 + sp.userData.ph * 9) * .08, 1.2 + u * .9, sz);
      sp.scale.setScalar(.15 + u * .45); sp.material.opacity = .5 * (1 - u);
    });
    // 店員
    const seen = new Set();
    for (const p of s.pl) {
      seen.add(p.id);
      let o = G.staff[p.id];
      if (!o) o = G.staff[p.id] = staffMesh(p);
      const isMe = p.id === app.myId && me, pos = isMe ? me : (app.rp[p.id] || p);
      o.g.position.set(pos.x, 0, pos.z); o.g.rotation.y = pos.yw;
      // 窓の前では自分の体で客が隠れるので半透明にする
      const alpha = isMe && pos.z > .15 && pos.x < KX ? .3 : 1;
      if (o.alpha !== alpha) {
        o.alpha = alpha;
        o.g.traverse(m => { if (m.material && m.parent !== o.held) { m.material.transparent = alpha < 1; m.material.opacity = alpha; m.material.depthWrite = alpha === 1; m.material.needsUpdate = true; } });
      }
      const moving = (isMe ? me.mv : pos.mv || 0) > .3, bow = isMe ? me.bow : p.bw;
      let P = moving ? walkPose(now * 9) : { ...STAND };
      if (p.h) { P.elR = [.2, 1.12, .12]; P.elL = [-.2, 1.12, .12]; P.haR = [.1, 1.08, .3]; P.haL = [-.1, 1.08, .3]; }
      if (bow > 0) P = T3.lean(P, .75 * Math.sin(Math.min(1, bow / 1.2) * Math.PI));
      o.body.pose(P);
      const key = p.h ? JSON.stringify(p.h) : '';
      if (key !== o.heldKey) { if (o.held) o.g.remove(o.held); o.held = p.h ? makeBowl(p.h) : null; if (o.held) o.g.add(o.held); o.heldKey = key; }
      if (o.held) { o.held.position.set(0, P.haR[1] - .02, P.haR[2] + .02); o.held.rotation.set(P.hx ? P.hx * .3 : 0, 0, 0); }
    }
    for (const id in G.staff) if (!seen.has(+id)) { scene.remove(G.staff[id].g); delete G.staff[id]; }
    // カメラ: 店員の後ろ上から客席側を見る
    const fx = me ? me.x : 6, fz = me ? me.z : .5;
    const camTo = T3.V3([fx, 2.45, fz - 2.2]);
    if (!G.camPos) G.camPos = camTo.clone();
    G.camPos.lerp(camTo, Math.min(1, 6 * dt));
    camera.position.copy(G.camPos); camera.lookAt(G.camPos.x, .8, G.camPos.z + 3.2);
    renderer.render(scene, camera);
    hud(app, s, dt, W, H, now);
  }
  function walkPose(ph) {
    const P = { ...STAND };
    for (const [s, k] of [['R', 0], ['L', 1]]) {
      const sw = Math.sin(ph + k * Math.PI);
      P['kn' + s] = [STAND['kn' + s][0], .5 + Math.max(0, sw) * .04, .02 + sw * .14];
      P['an' + s] = [STAND['an' + s][0], .08 + Math.max(0, sw) * .08, -.02 + sw * .24];
      P['to' + s] = [STAND['to' + s][0], .03 + Math.max(0, sw) * .08, .12 + sw * .24];
      P['ha' + s] = [STAND['ha' + s][0], .9, .03 - sw * .14];
      P['el' + s] = [STAND['el' + s][0], 1.13, -sw * .06];
    }
    return P;
  }
  function toScreen(p, W, H) {
    const v = new THREE.Vector3(p[0], p[1], p[2]).project(G.camera);
    return v.z > 1 ? null : [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H];
  }
  function hud(app, s, dt, W, H, now) {
    const mine = s.pl.find(p => p.id === app.myId), rule = app.init.rule;
    // 席の状態アイコン
    s.se.forEach((se, i) => {
      if (!se.op) return;
      const sc = toScreen([SX(i), 1.78, 1.25], W, H); if (!sc) return;
      const icon = { call: '🔔', kaecall: '🔔', wait: '⏳', kaewait: '⏳', eating: '🍜', dirty: '🧹', sheet: '📝', enter: '🚶', leave: '👋' }[se.st];
      if (icon) emo(icon, sc[0], sc[1] + (se.st === 'call' || se.st === 'kaecall' ? Math.sin(now * 10) * 3 * dpr : 0), 20 * dpr);
      if (se.pat > 0 && se.st !== 'eating') bar(sc[0] - 18 * dpr, sc[1] + 13 * dpr, 36 * dpr, 5 * dpr, se.pat, se.pat > .5 ? '#69f0ae' : se.pat > .25 ? '#ffb300' : '#ff5252');
      if (se.st === 'eating' && !se.gr) label('食事中', sc[0], sc[1] + 18 * dpr, 10 * dpr, '#ffcf40', '#000');
    });
    // ゆで時間ゲージ(かため/ふつう/やわめ)
    s.bk.forEach((t, k) => {
      if (t < 0) return;
      const sc = toScreen([9.5 + k * .25, 1.45, -.6], W, H); if (!sc) return;
      const w = 46 * dpr, h = 7 * dpr, x0 = sc[0] - w / 2, y0 = sc[1];
      [['#777', 0, 2.5], ['#4fc3ff', 2.5, 5], ['#69f0ae', 5, 8], ['#ffb300', 8, 11], ['#ff5252', 11, 13]].forEach(([c, a, b]) => { ctx.fillStyle = c; ctx.fillRect(x0 + w * a / 13, y0, w * (b - a) / 13, h); });
      ctx.fillStyle = '#fff'; ctx.fillRect(x0 + w * Math.min(t, 13) / 13 - 1.5 * dpr, y0 - 3 * dpr, 3 * dpr, h + 6 * dpr);
      label(MEN[firm(t)], sc[0], y0 - 9 * dpr, 11 * dpr, '#fff', '#000');
    });
    // 他の店員の名前
    for (const p of s.pl) {
      if (p.id === app.myId) continue;
      const pos = app.rp[p.id] || p, sc = toScreen([pos.x, 1.85, pos.z], W, H);
      if (sc) label(p.n, sc[0], sc[1], 11 * dpr, p.c, '#000c');
    }
    // 伝票レール(注文済みの席)
    const orders = s.se.map((se, i) => ({ se, i })).filter(({ se }) => (se.st === 'wait' || se.st === 'kaewait') && se.o);
    orders.slice(0, 5).forEach(({ se, i }, k) => {
      const x0 = 8 * dpr, y0 = 44 * dpr + k * 46 * dpr, w = Math.min(W * .42, 300 * dpr), h = 40 * dpr;
      ctx.fillStyle = '#f6efdc'; rrect(x0, y0, w, h, 6 * dpr); ctx.fill();
      ctx.fillStyle = '#8b1a1a'; ctx.fillRect(x0, y0, 5 * dpr, h);
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#3a1a10';
      ctx.font = `bold ${12 * dpr}px sans-serif`;
      const owner = rule === 'vs' && se.ow != null ? ` (${(s.pl.find(p => p.id === se.ow) || {}).n || '?'})` : '';
      ctx.fillText(`${NS - i}番 ${CTYPES[se.ty] ? CTYPES[se.ty].name : ''}${owner}${se.st === 'kaewait' ? ' 【替玉】' : ''}`, x0 + 10 * dpr, y0 + 12 * dpr);
      ctx.font = `${11 * dpr}px sans-serif`;
      ctx.fillText(se.st === 'kaewait' ? `麺だけ・${MEN[se.o.men]}` : orderText(se.o), x0 + 10 * dpr, y0 + 28 * dpr);
      bar(x0 + w - 50 * dpr, y0 + 8 * dpr, 42 * dpr, 6 * dpr, se.pat, se.pat > .5 ? '#2e7d32' : se.pat > .25 ? '#ff8f00' : '#c62828');
    });
    // 上部: 時間・売上
    const tm = Math.max(0, Math.ceil(s.tm));
    label(`${Math.floor(tm / 60)}:${String(tm % 60).padStart(2, '0')}`, W / 2, 20 * dpr, 22 * dpr, tm <= 15 && Math.sin(now * 8) > 0 ? '#ff5252' : '#fff', '#000');
    if (rule === 'coop') label(`売上 ¥${s.tot.toLocaleString()}`, W - 80 * dpr, 20 * dpr, 16 * dpr, '#ffcf40', '#000');
    else [...s.pl].sort((a, b) => b.sa - a.sa).slice(0, 4).forEach((p, k) =>
      label(`${k + 1}. ${p.n} ¥${p.sa.toLocaleString()}`, W - 85 * dpr, (16 + k * 16) * dpr, 12 * dpr, p.id === app.myId ? '#ffcf40' : '#fff', '#000'));
    // 持ち物と操作ヒント
    if (mine) {
      if (mine.h) label(`持ち物: ${bowlText(mine.h)}`, W / 2, H - 46 * dpr, 13 * dpr, '#fff', '#000');
      const act = app.me ? actionText(s, app.me, mine.h) : '';
      if (act) label(act, W / 2, H - 24 * dpr, 15 * dpr, act.startsWith('⚠') ? '#ff5252' : '#ffcf40', '#000');
    }
    // ふきだし
    app.floaters = app.floaters.filter(f => (f.t -= dt) > 0);
    for (const f of app.floaters) {
      const sc = typeof f.z === 'number' ? toScreen([f.x, f.y, f.z], W, H) : null;
      if (!sc) continue;
      const col = f.k === 'angry' || f.k === 'nope' ? '#ff5252' : f.k === 'serve' || f.k === 'goal' ? '#ffcf40' : f.k === 'relax' ? '#4fc3ff' : '#fff';
      label(f.txt, sc[0], sc[1] - (1.5 - f.t) * 26 * dpr, 14 * dpr, col, '#000');
    }
    countdown(s, W, H);
  }
})();

// =====================================================================
// 起動
// =====================================================================
Input.init();
initTouch();
$('#nameIn').value = store('waiwai-name') || '';
const hashCode = location.hash.slice(1).toUpperCase();
if (/^[A-Z]{4}$/.test(hashCode)) { $('#codeIn').value = hashCode; setStatus('コードが入力済み!なまえを入れて「参加」を押してね'); }
$('#createBtn').onclick = createRoom;
$('#joinBtn').onclick = joinRoom;
$('#codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
$('#startBtn').onclick = hostStart;
$('#backBtn').onclick = hostBackToLobby;
$('#leaveBtn').onclick = () => backToTitle('');
$('#copyBtn').onclick = () => {
  const el = $('#shareUrl'); el.select();
  (navigator.clipboard ? navigator.clipboard.writeText(el.value) : Promise.reject()).then(() => toast('URLをコピーしました'), () => { document.execCommand('copy'); toast('URLをコピーしました'); });
};
resize();
requestAnimationFrame(frame);
</script>
